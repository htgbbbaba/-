    if (state.view === 'materials') { return state.matQuery; }
    return state.recipeQuery;
  }
  function pageOf() { return activeQuery(); }
  function sortOf(t, key) {
    var q = activeQuery();
    if (q.sort === key) { q.dir = q.dir === 'asc' ? 'desc' : 'asc'; }
    else { q.sort = key; q.dir = 'desc'; }
    q.page = 1;
  }

  function pager(res) {
    if (res.pages <= 1) { return ''; }
    var btns = [];
    for (var i = 1; i <= res.pages; i++) {
      btns.push('<button class="pg' + (i === res.page ? ' on' : '') + '" data-action="page" data-page="' + i + '">' + i + '</button>');
    }
    return '<div class="pager">' + btns.join('') + '<span class="muted">第 ' + res.page + '/' + res.pages + ' 页</span></div>';
  }

  /* SECTION: 配料记录列表 */
  function renderProduction() {
    var q = state.prodQuery;
    var res = state.svc.queryProduction(q);
    var canCreate = state.auth.can(state.session, 'production.create');

    var toolbar =
      '<div class="toolbar">' +
      '<input class="search" placeholder="搜索批次 / 配方 / 产线 / 操作员" value="' + h.esc(q.search) + '" data-input="prod-search">' +
      '<select data-input="prod-qc">' + ['', 'pass', 'fail', 'pending'].map(function (s) {
        return '<option value="' + s + '"' + (q.qcResult === s ? ' selected' : '') + '>' +
          (s ? h.esc(h.qcLabel(s)) : '全部质检') + '</option>';
      }).join('') + '</select>' +
      '<label class="daterange">从<input type="date" value="' + h.esc(q.from) + '" data-input="prod-from"></label>' +
      '<label class="daterange">到<input type="date" value="' + h.esc(q.to) + '" data-input="prod-to"></label>' +
      (canCreate ? '<button class="btn primary" data-action="prod-new" data-primary-action="production-create">＋ 登记配料</button>' : '') +
      '<button class="btn ghost" data-action="prod-export">导出 CSV</button>' +
      '</div>';

    var rows = res.items.map(function (p) {
      return '<tr>' +
        '<td>' + h.esc(p.planDate) + '</td>' +
        '<td>' + h.esc(p.recipeName) + '</td>' +
        '<td>' + h.esc(p.line || '—') + '</td>' +
        '<td>' + h.esc(p.operator) + '</td>' +
        '<td class="row-actions">' +
          '<button class="btn xs" data-action="prod-view" data-id="' + h.esc(p.id) + '">详情</button>' +
          (state.auth.can(state.session, 'production.update')
            ? '<button class="btn xs" data-action="prod-edit" data-id="' + h.esc(p.id) + '">编辑</button>' : '') +
          (state.auth.can(state.session, 'production.delete')
            ? '<button class="btn xs danger" data-action="prod-del" data-id="' + h.esc(p.id) + '">删除</button>' : '') +
        '</td></tr>';
    }).join('');

    var table = res.total
      ? '<div class="table-wrap"><table><thead><tr>' +
        sortTh('planDate', '配料日期', q) + '<th>配方</th><th>产线</th><th>操作员</th><th></th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table></div>' + pager(res)
      : '<div class="table-wrap">' + emptyBlock('没有符合条件的配料记录') + '</div>';

    return '<div class="page-head"><h2>配料记录</h2><span class="muted">共 ' + res.total + ' 条</span></div>' +
      toolbar + table;
  }

  /* 投料→产出展示：未登记环节显示 — */
  function qtyPair(p) {
    if (numOr(p.inputQty) <= 0) { return '—'; }
    return h.fmtNum(p.inputQty, 0) + ' → ' + (numOr(p.outputQty) > 0 ? h.fmtNum(p.outputQty, 0) : '—');
  }

  /* SECTION: 原材料库（REQ-011/012） */
  function renderMaterials() {
    var q = state.matQuery;
    var res = state.mats.query(q);
    var canManage = state.auth.can(state.session, 'material.manage');

    var toolbar =
      '<div class="toolbar">' +
      '<input class="search" placeholder="搜索 名称 / 系统料号 / 内部编号" value="' + h.esc(q.search) + '" data-input="mat-search">' +
      (canManage ? '<button class="btn primary" data-action="mat-new" data-primary-action="material-create">＋ 添加原料</button>' : '') +
      '<button class="btn ghost" data-action="mat-export">导出 CSV</button>' +
      '</div>';

    var rows = res.items.map(function (m) {
      return '<tr>' +
        '<td class="num">' + h.esc(m.sysCode || '—') + '</td>' +
        '<td><b>' + h.esc(m.intCode || '—') + '</b></td>' +
        '<td>' + h.esc(m.name) + '</td>' +
        '<td class="dim">' + h.esc(m.fullName || '—') + '</td>' +
        '<td class="num">' + (m.unitPrice == null ? '—' : h.fmtMoney(m.unitPrice) + '/' + h.esc(m.unit || 'kg')) + '</td>' +
        '<td><span class="chip src-' + h.esc(m.source || 'excel') + '">' +
          (m.source === 'manual' ? '手工添加' : 'Excel 导入') + '</span></td>' +
        '<td class="row-actions">' +
          (canManage ? '<button class="btn xs" data-action="mat-edit" data-id="' + h.esc(m.id) + '">编辑</button>' +
            '<button class="btn xs danger" data-action="mat-del" data-id="' + h.esc(m.id) + '">删除</button>' : '') +
        '</td></tr>';
    }).join('');

    var table = res.total
      ? '<div class="table-wrap"><table><thead><tr><th>系统料号</th><th>内部编号</th><th>名称</th>' +
        '<th>全称</th><th class="num">参考单价</th><th>来源</th><th></th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table></div>' + pager(res)
      : '<div class="table-wrap">' + emptyBlock('没有匹配的原料，可调整关键词或添加新原料') + '</div>';

    return '<div class="page-head"><h2>原材料库</h2>' +
      '<span class="muted">共 ' + res.total + ' 条（Excel 种子 ' + state.mats.seedCount + ' 条）</span></div>' +
      toolbar + table;
  }

  /* SECTION: 原材料库（REQ-011/012） */
  function materialFormHtml() {
    var f = state.matForm, d = f.data;
    return '<div class="mask" data-action="modal-close"><div class="modal" role="dialog">' +
      '<h3>' + (f.id ? '编辑原料 ' + h.esc(f.id) : '添加新原料') + '</h3>' +
      '<form data-form="material" class="grid-2">' +
        field('name', '名称', '<input name="name" value="' + h.esc(d.name || '') + '">') +
        field('intCode', '内部编号', '<input name="intCode" value="' + h.esc(d.intCode || '') + '">') +
        field('sysCode', '系统料号', '<input name="sysCode" value="' + h.esc(d.sysCode || '') + '">') +
        field('fullName', '全称', '<input name="fullName" value="' + h.esc(d.fullName || '') + '">') +
        field('unit', '计量单位', '<input name="unit" value="' + h.esc(d.unit || 'kg') + '">') +
        field('unitPrice', '参考单价', '<input name="unitPrice" type="number" min="0" step="0.01" value="' + h.esc(d.unitPrice == null ? '' : d.unitPrice) + '">') +
      '</form>' +
      '<div class="err-slot">' + formErrorsHtml(f.errors) + '</div>' +
      '<div class="modal-actions"><button class="btn ghost" data-action="modal-close">取消</button>' +
      '<button class="btn primary" data-action="mat-save">保存原料</button></div>' +
      '</div></div>';
  }

  /* 组分行的原料检索弹窗 */
  function pickerModalHtml() {
    var p = state.picker;
    var hits = p.hits || [];
    var listHtml = hits.length
      ? '<div class="picker-list">' + hits.map(function (m) {
          return '<div class="picker-row" data-action="mat-use" data-mid="' + h.esc(m.id) + '">' +
            '<b>' + h.esc(m.name) + '</b>' +
            '<span class="codes">' + h.esc(m.sysCode || '—') + ' · ' + h.esc(m.intCode || '—') + '</span>' +
            '<span class="price">' + (m.unitPrice == null ? '—' : h.fmtMoney(m.unitPrice)) + '</span>' +
            '</div>';
        }).join('') + '</div>'
      : '<div class="empty"><span>◇</span><p>未找到匹配原料，可在下方直接添加</p></div>';
    return '<div class="mask" data-action="picker-close"><div class="modal picker" role="dialog">' +
      '<h3>检索原料</h3>' +
      '<input class="picker-search" data-input="picker-search" placeholder="输入 名称 / 系统料号 / 内部编号 片段" value="' + h.esc(p.keyword || '') + '">' +
      listHtml +
      '<div class="modal-actions">' +
        (state.auth.can(state.session, 'material.manage')
          ? '<button class="btn" data-action="mat-new-from-picker">＋ 新原料入库</button>' : '') +
        '<button class="btn ghost" data-action="picker-close">关闭</button>' +
      '</div></div></div>';
  }

  function openMaterialPicker(rowIndex) {
    collectFormFromDom();
    state.lastPickerRow = rowIndex;
    state.picker = { row: rowIndex, keyword: '', hits: state.mats.search('') };
    renderModal();
    var inp = el.modal.querySelector('.picker-search');
    if (inp) { inp.focus(); }
  }

  function useMaterial(id) {
    var m = state.mats.get(id);
    if (!m || !state.picker) { return; }
    collectFormFromDom();
    /* 原胶行：写入原胶专用字段 */
    if (state.picker.row === 'gum') {
      state.form.data.gumMaterialId = m.id;
      state.form.data.gumName = m.name || '';
      state.form.data.gumIntCode = m.intCode || m.sysCode || '';
      state.form.data.gumSysCode = m.sysCode || '';
      if (m.unit) { state.form.data.gumUnit = m.unit; }
      state.picker = null;
      renderModal();
      flash('已带入原料「' + m.name + '」');
      return;
    }
    var comps = state.form.data.components || (state.form.data.components = []);
    var comp = comps[state.picker.row] || (comps[state.picker.row] = {});
    comp.materialId = m.id;
    comp.name = m.name || '';
    comp.intCode = m.intCode || m.sysCode || '';
    comp.sysCode = m.sysCode || '';
    comp.materialCode = m.intCode || m.sysCode || '';
    if (m.unit) { comp.unit = m.unit; }
    state.picker = null;
    renderModal();
    flash('已带入原料「' + m.name + '」');
  }

  /* 原料表单专用收集（独立于配方/生产表单） */
  function collectMatFormFromDom() {
    if (!state.matForm) { return; }
    var form = el.modal.querySelector('form[data-form="material"]');
    if (!form) { return; }
    var data = state.matForm.data || {};
    Array.prototype.forEach.call(form.elements, function (f) {
      if (f.name) { data[f.name] = f.value; }
    });
    state.matForm.data = data;
  }

  function saveMaterial() {
    collectMatFormFromDom();
    guard('material.manage', function () {
      var f = state.matForm;
      var res = f.id ? state.mats.update(f.id, f.data) : state.mats.create(f.data);
      if (res.ok) {
        var wasPicker = state.backToPicker;
        state.matForm = null; state.backToPicker = false;
        flash(f.id ? '原料已更新' : '原料已添加：' + res.material.id);
        if (wasPicker) {
          /* 从检索浮层进来：回到浮层并展示新入库原料 */
          state.picker = { row: f.pickerRow, keyword: res.material.intCode || '',
            hits: [res.material] };
          renderModal();
        } else {
          render();
        }
      } else {
        f.errors = res.errors || { _: res.error };
        renderModal();
      }
    }, function () { state.matForm.errors = { _: '没有原料维护权限' }; renderModal(); });
  }

  /* SECTION: 账号管理（REQ-002） */
  function renderUsers() {
    var users = state.auth.listUsers();
    return '<div class="page-head"><h2>账号管理</h2>' +
      '<button class="btn primary" data-action="user-add" data-primary-action="user-create">＋ 新增账号</button></div>' +
      '<div class="table-wrap"><table><thead><tr><th>账号</th><th>姓名</th><th>角色</th><th class="num">创建时间</th><th></th></tr></thead><tbody>' +
      users.map(function (u) {
        return '<tr><td><b>' + h.esc(u.username) + '</b></td><td>' + h.esc(u.displayName) + '</td>' +
          '<td><span class="chip role-' + h.esc(u.role) + '">' + h.esc(state.auth.roleLabel(u.role)) + '</span></td>' +
          '<td class="num dim">' + h.esc(h.fmtDateTime(u.createdAt)) + '</td>' +
          '<td class="row-actions"><button class="btn xs" data-action="user-reset" data-id="' + h.esc(u.username) + '">重置口令</button>' +
          '<button class="btn xs danger" data-action="user-del" data-id="' + h.esc(u.username) + '">删除</button></td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  /* SECTION: 数据管理（REQ-008） */
  function renderData() {
    var bytes = state.store.estimateUsage();
    var counts = [
      ['配方', state.svc.listRecipes().length],
      ['配料记录', state.svc.listProduction().length],
      ['原材料', state.mats.list().length],
      ['账号', state.auth.listUsers().length]
    ];
    return '<div class="page-head"><h2>数据管理</h2></div>' +
      '<div class="card-grid">' +
      panel('本地存储概览',
        '<div class="kv-list">' + counts.map(function (c) {
          return '<div class="kv"><span>' + c[0] + '</span><b>' + c[1] + ' 条</b></div>';
        }).join('') +
        '<div class="kv"><span>占用空间</span><b>' + (bytes / 1024).toFixed(1) + ' KB</b></div>' +
        '<p class="muted">数据保存在当前浏览器 localStorage，清除浏览器数据会丢失。</p></div>') +
      panel('备份与恢复',
        '<div class="btn-row">' +
          '<button class="btn primary" data-action="data-export-json" data-primary-action="data-export">导出全量 JSON</button>' +
          (state.auth.can(state.session, 'data.import')
            ? '<label class="btn file">导入 JSON<input type="file" accept="application/json,.json" data-input="data-import"></label>' : '') +
        '</div>' +
        '<p class="muted">导出的文件包含配方、配料记录、原材料库与账号哈希，可在另一台机器导入恢复。</p>') +
      panel('示例数据',
        '<div class="btn-row">' +
          (state.auth.can(state.session, 'data.reset')
            ? '<button class="btn danger" data-action="data-reseed">重置为示例数据</button>' : '') +
        '</div><p class="muted">重置会清空当前所有本地数据并恢复初始示例。</p>') +
      '</div>';
  }

  /* SECTION: 详情与表单弹窗 */
  function renderModal() {
    if (state.detail) {
      renderDetailModal();
      return;
    }
    if (state.confirm) {
      var c = state.confirm;
      el.modal.innerHTML = '<div class="mask" data-action="modal-close"><div class="modal" role="dialog">' +
        '<h3>' + h.esc(c.title) + '</h3><div class="modal-body">' + c.body + '</div>' +
        '<div class="modal-actions"><button class="btn ghost" data-action="modal-close">取消</button>' +
        '<button class="btn ' + (c.danger ? 'danger' : 'primary') + '" data-action="confirm-ok" data-primary-action="confirm">' +
        h.esc(c.okLabel || '确定') + '</button></div></div></div>';
      return;
    }
    if (state.picker) {
      el.modal.innerHTML = pickerModalHtml();
      return;
    }
    if (state.matForm) {
      el.modal.innerHTML = materialFormHtml();
      return;
    }
    if (state.form) {
      if (state.form.type === 'recipe') {
        el.modal.innerHTML = recipeFormHtml();
        updateFormCalc();
      } else if (state.form.type === 'register') {
        el.modal.innerHTML = registerModalHtml();
      } else {
        el.modal.innerHTML = productionFormHtml();
        updateFormCalc();
      }
      return;
    }
    el.modal.innerHTML = '';
  }

  function recipeFormHtml() {
    var f = state.form, d = f.data, isNew = !f.id;
    var comps = d.components || [];
    var rows = comps.map(function (c, i) {
      return compRow(c, i, f.errors['components.' + i]);
    }).join('');
    return '<div class="mask" data-action="modal-close"><div class="modal wide" role="dialog">' +
      '<h3>' + (isNew ? '新建配方' : '编辑配方 ' + h.esc(f.id)) + '</h3>' +
      '<form data-form="recipe" class="grid-2">' +
        field('name', '配方名称', '<input name="name" value="' + h.esc(d.name) + '">') +
        field('category', '类目', '<input name="category" value="' + h.esc(d.category) + '" list="cat-list"><datalist id="cat-list">' +
          state.svc.recipeCategories().map(function (c) { return '<option value="' + h.esc(c) + '"></option>'; }).join('') + '</datalist>') +
        field('version', '版本号', '<input name="version" value="' + h.esc(d.version || 'V0.1') + '">') +
        field('unit', '计量单位', '<input name="unit" value="' + h.esc(d.unit || 'kg') + '">') +
        field('status', '状态（通过列表流转按钮变更）',
          '<input type="hidden" name="status" value="' + h.esc(d.status || 'draft') + '">' +
          '<input value="' + h.esc(h.recipeStatusLabel(d.status || 'draft')) + '" disabled>') +
        '<label class="field span-2"><span>备注</span><textarea name="notes" rows="2">' + h.esc(d.notes || '') + '</textarea></label>' +
      '</form>' +
      '<div class="comp-head"><h4>组分清单</h4><button class="btn sm" data-action="comp-add">＋ 添加组分</button></div>' +
      '<div class="comp-table"><div class="comp-row head"><span>物料名称</span><span>内部编号</span><span>系统料号</span><span>用量</span><span>单位</span><span>含量%</span><span></span></div>' +
      gumRowHtml(d) +
      rows + '</div>' +
      '<div class="form-calc" id="form-calc"></div>' +
      '<div class="err-slot">' + formErrorsHtml(f.errors) + '</div>' +
      '<div class="modal-actions"><button class="btn ghost" data-action="modal-close">取消</button>' +
      '<button class="btn primary" data-action="recipe-save" data-primary-action="recipe-save">保存配方</button></div>' +
      '</div></div>';
  }

  /* 百分比含量：单组分用量 /（组分总用量 + 原胶）× 100% */
  function compPct(comps, i, gumQty) {
    var total = (comps || []).reduce(function (s, c) { return s + numOr(c && c.qty); }, 0) + numOr(gumQty);
    if (total <= 0) { return '—'; }
    return h.fmtPct(numOr(comps[i] && comps[i].qty) / total * 100);
  }

  /* 原胶自身含量% */
  function gumPct(comps, gumQty) {
    var total = (comps || []).reduce(function (s, c) { return s + numOr(c && c.qty); }, 0) + numOr(gumQty);
    if (total <= 0) { return '—'; }
    return h.fmtPct(numOr(gumQty) / total * 100);
  }

  /* 原胶独立项：组分清单首行，可填写物料名称/内部编号/系统料号/用量/单位，支持检索原料 */
  function gumRowHtml(d) {
    var comps = d.components || [];
    return '<div class="comp-row gum-row" data-gumrow="1">' +
      '<div class="comp-name-cell"><input data-gum="name" value="' + h.esc(d.gumName || '') + '" placeholder="原胶（物料名称）">' +
      '<button class="btn xs pick" data-action="mat-pick" data-row="gum" title="从原材料库检索">检索原料</button></div>' +
      '<input data-gum="intCode" value="' + h.esc(d.gumIntCode || '') + '" placeholder="内部编号">' +
      '<input data-gum="sysCode" value="' + h.esc(d.gumSysCode || '') + '" placeholder="系统料号">' +
      '<input data-gum="qty" type="number" min="0" step="0.01" value="' + h.esc(d.gumQty != null ? d.gumQty : '') + '" placeholder="原胶用量">' +
      '<input data-gum="unit" value="' + h.esc(d.gumUnit || 'kg') + '">' +
      '<span class="sub-cell pct-cell">' + gumPct(comps, d.gumQty) + '</span>' +
      '<span class="muted gum-hint">折算锚点</span>' +
      '</div>';
  }

  function compRow(c, i, err) {
    return '<div class="comp-row' + (err ? ' bad' : '') + '" data-row="' + i + '">' +
      '<div class="comp-name-cell"><input data-comp="name" value="' + h.esc(c.name || '') + '" placeholder="物料名称">' +
      '<button class="btn xs pick" data-action="mat-pick" data-row="' + i + '" title="从原材料库检索">检索原料</button></div>' +
      '<input data-comp="intCode" value="' + h.esc(c.intCode || c.materialCode || '') + '" placeholder="内部编号">' +
      '<input data-comp="sysCode" value="' + h.esc(c.sysCode || '') + '" placeholder="系统料号">' +
      '<input data-comp="qty" type="number" min="0" step="0.01" value="' + h.esc(c.qty) + '">' +
      '<input data-comp="unit" value="' + h.esc(c.unit || 'kg') + '">' +
      '<span class="sub-cell pct-cell">' + compPct(state.form.data.components, i, state.form.data.gumQty) + '</span>' +
      '<button class="btn xs danger" data-action="comp-del" data-row="' + i + '">✕</button>' +
      (err ? '<em class="row-err">' + h.esc(err) + '</em>' : '') +
      '</div>';
  }

  function numOr(v) { var n = Number(v); return Number.isFinite(n) ? n : 0; }

  function productionFormHtml() {
    var f = state.form, d = f.data;
    var recipes = state.svc.listRecipes().filter(function (r) { return r.status === 'active' || r.id === d.recipeId; });
    return '<div class="mask" data-action="modal-close"><div class="modal wide" role="dialog">' +
      '<h3>' + (f.id ? '编辑配料记录 ' + h.esc(f.id) : '登记配料批次') + '</h3>' +
      '<form data-form="production" class="grid-2">' +
        field('recipeId', '配方', '<select name="recipeId">' +
          '<option value="">请选择…</option>' + recipes.map(function (r) {
            return '<option value="' + h.esc(r.id) + '"' + (d.recipeId === r.id ? ' selected' : '') + '>' +
              h.esc(r.id + ' · ' + r.name) + '</option>';
          }).join('') + '</select>') +
        field('planDate', '配料日期', '<input name="planDate" type="date" value="' + h.esc(d.planDate) + '">') +
        field('line', '产线', '<input name="line" value="' + h.esc(d.line || '') + '">') +
        field('operator', '操作员', '<select name="operator">' +
          '<option value="">请选择…</option>' +
          state.auth.listUsers().map(function (u) {
            var nm = u.displayName || u.username;
            return '<option value="' + h.esc(nm) + '"' + (d.operator === nm ? ' selected' : '') + '>' + h.esc(nm) + '</option>';
          }).join('') +
          (d.operator && !state.auth.listUsers().some(function (u) { return (u.displayName || u.username) === d.operator; })
            ? '<option value="' + h.esc(d.operator) + '" selected>' + h.esc(d.operator) + '（已删除）</option>'
            : '') +
          '</select>') +
        field('targetGum', '目标原胶量',
          '<input name="targetGum" type="number" min="0" step="0.01" value="' + h.esc(d.targetGum != null ? d.targetGum : '') + '" placeholder="按配方原胶量折算">') +
        '<label class="field span-2"><span>备注</span><textarea name="remarks" rows="2">' + h.esc(d.remarks || '') + '</textarea></label>' +
      '</form>' +
      usageSectionHtml(d) +
      colorAdjustSectionHtml(d) +
      '<div class="form-calc" id="form-calc"></div>' +
      '<div class="err-slot">' + formErrorsHtml(f.errors) + '</div>' +
      '<div class="modal-actions"><button class="btn ghost" data-action="modal-close">取消</button>' +
      '<button class="btn primary" data-action="prod-save" data-primary-action="production-save">保存记录</button></div>' +
      '</div></div>';
  }

  /* SECTION: 逐原料实际用量（REQ-013）
   * 配方量列展示百分比；配料用量列按「目标原胶量 ÷ 配方原胶量」比例折算。
   */
  function usageSectionHtml(d) {
    var usage = d.materialUsage || [];
    if (!usage.length) {
      return '<div class="comp-head"><h4>原料使用量</h4></div>' +
        '<div class="table-wrap"><p class="muted" style="padding:12px">选择配方后自动生成逐原料用量清单。</p></div>';
    }
    var rows = usage.map(function (u, i) {
      return '<div class="comp-row" data-urow="' + i + '">' +
        '<span class="u-name">' + h.esc(u.name || '—') + '</span>' +
        '<span class="u-code">' + h.esc(u.intCode || u.materialCode || '—') + '</span>' +
        '<span class="u-code">' + h.esc(u.sysCode || '—') + '</span>' +
        '<span class="u-plan">' + usagePctText(u) + '</span>' +
        '<span class="u-calc">' + usageCalcText(u) + '</span>' +
        '<input data-usage="actualQty" type="number" min="0" step="0.01" value="' + h.esc(u.actualQty) + '" placeholder="实际">' +
        '<span class="u-unit">' + h.esc(u.unit || '') + '</span>' +
        '<span class="u-diff">' + usageDiffText(u) + '</span>' +
        '</div>';
    }).join('');
    return '<div class="comp-head"><h4>原料使用量</h4>' +
        '<span class="muted">实际用量合计 <b id="usage-total">' + h.fmtNum(state.svc.usageTotal(usage), 2) + '</b></span></div>' +
      '<div class="comp-table"><div class="comp-row head u-head"><span>物料</span><span>内部编号</span><span>系统料号</span><span>配方量%</span><span>配料用量</span><span>实际量</span><span>单位</span><span>偏差</span></div>' +
      rows + '</div>';
  }

  function usagePctText(u) {
    if (u && u.planPct != null) { return h.fmtPct(u.planPct); }
    return u && u.planQty != null ? h.fmtNum(u.planQty, 2) : '—';
  }

  function usageCalcText(u) {
    if (u && u.calcQty != null) { return h.fmtNum(u.calcQty, 2); }
    return u && u.planQty != null ? h.fmtNum(u.planQty, 2) : '—';
  }

  function usageDiffText(u) {
    var v = u && u.actualQty;
    if (v === '' || v == null) { return '—'; }
    var base = (u && u.calcQty != null) ? u.calcQty : numOr(u.planQty);
    var diff = numOr(v) - numOr(base);
    if (Math.abs(diff) < 0.005) { return '<span class="diff-ok">0</span>'; }
    var sign = diff > 0 ? '+' : '';
    return '<span class="' + (diff > 0 ? 'diff-up' : 'diff-down') + '">' + sign + h.fmtNum(diff, 2) + '</span>';
  }

  /* SECTION: 调色记录（REQ-014） */
  function colorAdjustSectionHtml(d) {
    var adj = d.colorAdjust || { items: [], note: '' };
    var items = adj.items || [];
    var rows = items.map(function (it, i) {
      return '<div class="comp-row" data-arow="' + i + '">' +
        '<input data-adj="material" value="' + h.esc(it.material || '') + '" placeholder="调色物料/色浆" list="mat-names">' +
        '<input data-adj="intCode" value="' + h.esc(it.intCode || '') + '" placeholder="内部编号">' +
        '<input data-adj="qty" type="number" min="0" step="0.01" value="' + h.esc(it.qty) + '" placeholder="补加量">' +
        '<input data-adj="reason" value="' + h.esc(it.reason || '') + '" placeholder="调整原因，如偏浅补红">' +
        '<button class="btn xs danger" data-action="adj-del" data-row="' + i + '">✕</button>' +
        '</div>';
    }).join('');
    return '<div class="comp-head"><h4>调色记录</h4>' +
        '<span class="btn-row">' +
        '<span class="muted">补加合计 <b>' + h.fmtNum(state.svc.colorAdjustTotal(adj), 2) + '</b></span>' +
        '<button class="btn sm" data-action="adj-add">＋ 添加调色项</button></span></div>' +
      '<datalist id="mat-names">' + state.mats.list().slice(0, 400).map(function (m) {
        return '<option value="' + h.esc(m.name || m.intCode || '') + '"></option>';
      }).join('') + '</datalist>' +
      (items.length
        ? '<div class="comp-table"><div class="comp-row head a-head"><span>调色物料</span><span>内部编号</span><span>补加量</span><span>调整原因</span><span></span></div>' + rows + '</div>'
        : '<p class="muted" style="margin:6px 0 0">本批未发生调色调整。</p>') +
      '<label class="field span-2"><span>调色说明</span><textarea name="colorNote" rows="2" placeholder="记录实际生产中相对配方的颜色调整过程与结论">' + h.esc(adj.note || '') + '</textarea></label>';
  }

  function formErrorsHtml(errors) {
    var keys = Object.keys(errors || {});
    if (!keys.length) { return ''; }
    return '<div class="err-box">' + keys.map(function (k) {
      return '<p>· ' + h.esc(k.indexOf('components.') === 0 ? '组分问题：' + errors[k] : errors[k]) + '</p>';
    }).join('') + '</div>';
  }

  /* SECTION: 配方详情 */
  function recipeDetailHtml(r) {
    var comps = r.components || [];
    var gum = numOr(r.gumQty);
    var rows = '';
    if (gum > 0) {
      rows += '<tr class="gum-tr"><td>' + h.esc(r.gumName || '原胶') + '</td>' +
        '<td>' + h.esc(r.gumIntCode || '—') + '</td>' +
        '<td>' + h.esc(r.gumSysCode || '—') + '</td>' +
        '<td class="num">' + h.fmtNum(gum, 2) + ' ' + h.esc(r.gumUnit || r.unit || 'kg') + '</td>' +
        '<td class="num">' + gumPct(comps, r.gumQty) + '</td></tr>';
    }
    rows += comps.map(function (c) {
      return '<tr><td>' + h.esc(c.name) + '</td>' +
        '<td>' + h.esc(c.intCode || c.materialCode || '—') + '</td>' +
        '<td>' + h.esc(c.sysCode || '—') + '</td>' +
        '<td class="num">' + h.fmtNum(c.qty, 2) + ' ' + h.esc(c.unit || '') + '</td>' +
        '<td class="num">' + compPct(comps, comps.indexOf(c), r.gumQty) + '</td></tr>';
    }).join('');
    return '<div class="detail-meta">' +
      '<span>编号 <b>' + h.esc(r.id) + '</b></span><span>版本 <b>' + h.esc(r.version || '—') + '</b></span>' +
      '<span>类目 <b>' + h.esc(r.category) + '</b></span><span>计量单位 <b>' + h.esc(r.unit || '—') + '</b></span>' +
      '<span>组分数 <b>' + comps.length + '</b></span>' +
      (gum > 0 ? '<span>原胶 <b>' + h.fmtNum(gum, 2) + ' ' + h.esc(r.gumUnit || r.unit || 'kg') + '</b></span>' : '') +
      '</div>' +
      '<table class="mini"><thead><tr><th>物料</th><th>内部编号</th><th>系统料号</th><th>用量</th><th>含量%</th></tr></thead><tbody>' +
      rows +
      '</tbody></table>' +
      '<p class="detail-p"><b>备注：</b>' + h.esc(r.notes || '—') + '</p>' +
      '<p class="muted">创建 ' + h.esc(r.createdBy || '—') + ' · ' + h.esc(h.fmtDateTime(r.createdAt)) +
      ' · 更新 ' + h.esc(h.fmtDateTime(r.updatedAt)) + '</p>';
  }

  function productionDetailHtml(p) {
    return '<div class="detail-meta">' +
      '<span>批次 <b>' + h.esc(p.batchNo) + '</b></span>' +
      '<span>配方 <b>' + h.esc(p.recipeName) + '</b></span><span>产线 <b>' + h.esc(p.line) + '</b></span>' +
      '<span>操作员 <b>' + h.esc(p.operator) + '</b></span><span>配料日期 <b>' + h.esc(p.planDate) + '</b></span>' +
      (numOr(p.targetGum) > 0 || p.targetGum === '' || p.targetGum == null
        ? '<span>目标原胶量 <b>' + (p.targetGum === '' || p.targetGum == null ? '—' : h.fmtNum(p.targetGum, 2)) + '</b></span>' : '') +
      '</div>' +
      detailUsageHtml(p) +
      detailColorAdjustHtml(p) +
      '<p class="detail-p"><b>备注：</b>' + h.esc(p.remarks || '—') + '</p>';
  }

  function detailUsageHtml(p) {
    var usage = p.materialUsage || [];
    if (!usage.length) { return ''; }
    return '<h4 class="detail-sub">原料使用量 <span class="muted">实际合计 ' +
      h.fmtNum(state.svc.usageTotal(usage), 2) + '</span></h4>' +
      '<table class="mini"><thead><tr><th>物料</th><th>内部编号</th><th>系统料号</th><th>配方量%</th><th>配料用量</th><th>实际量</th><th>偏差</th></tr></thead><tbody>' +
      usage.map(function (u) {
        return '<tr><td>' + h.esc(u.name || '—') + '</td>' +
          '<td>' + h.esc(u.intCode || u.materialCode || '—') + '</td>' +
          '<td>' + h.esc(u.sysCode || '—') + '</td>' +
          '<td class="num">' + usagePctText(u) + '</td>' +
          '<td class="num">' + usageCalcText(u) + '</td>' +
          '<td class="num">' + (u.actualQty === '' || u.actualQty == null ? '—' : h.fmtNum(u.actualQty, 2)) + '</td>' +
          '<td class="num">' + usageDiffText(u) + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  function detailColorAdjustHtml(p) {
    var adj = p.colorAdjust;
    if (!adj) { return ''; }
    var items = adj.items || [];
    if (!items.length && !String(adj.note || '').trim()) { return ''; }
    var tbl = items.length
      ? '<table class="mini"><thead><tr><th>调色物料</th><th>内部编号</th><th>补加量</th><th>调整原因</th></tr></thead><tbody>' +
        items.map(function (it) {
          return '<tr><td>' + h.esc(it.material || '—') + '</td>' +
            '<td>' + h.esc(it.intCode || '—') + '</td>' +
            '<td class="num">' + h.fmtNum(it.qty, 2) + '</td>' +
            '<td>' + h.esc(it.reason || '—') + '</td></tr>';
        }).join('') + '</tbody></table>'
      : '';
    return '<h4 class="detail-sub">调色记录 <span class="muted">补加合计 ' +
      h.fmtNum(state.svc.colorAdjustTotal(adj), 2) + '</span></h4>' + tbl +
      (String(adj.note || '').trim() ? '<p class="detail-p">' + h.esc(adj.note) + '</p>' : '');
  }

  function row(k, v) {
    return '<tr><td>' + k + '</td><td class="num">' + v + '</td></tr>';
  }

  /* SECTION: 表单实时计算 */
  function updateFormCalc() {
    var box = el.modal.querySelector('#form-calc');
    if (!box || !state.form) { return; }
    if (state.form.type === 'recipe') {
      var comps = state.form.data.components || [];
      var gum = numOr(state.form.data.gumQty);
      var total = comps.reduce(function (s, c) { return s + numOr(c && c.qty); }, 0) + gum;
      box.innerHTML = '<span>组分 ' + comps.length + ' 项</span>' +
        (gum > 0 ? '<span>原胶 ' + h.fmtNum(gum, 2) + ' ' + h.esc(state.form.data.gumUnit || state.form.data.unit || 'kg') + '</span>' : '') +
        '<span>总用量 <b>' + h.fmtNum(total, 2) + '</b> ' + h.esc(state.form.data.unit || '') + '</span>' +
        '<span>含量合计 <b>100%</b></span>';
    } else {
      box.innerHTML = '';
    }
  }

  /* SECTION: 详情弹窗（配方含「历史变更和使用」页签） */
  function renderDetailModal() {
    if (!state.detail) { return; }
    if (state.detail.type === 'recipe') {
      var r = state.svc.getRecipe(state.detail.id);
      if (!r) { state.detail = null; el.modal.innerHTML = ''; return; }
      var tab = state.detail.tab === 'history' ? 'history' : 'detail';
      var tabs = '<div class="seg small" style="margin-left:auto">' +
        '<button class="' + (tab === 'detail' ? 'on' : '') + '" data-action="detail-tab" data-tab="detail">配方详情</button>' +
        '<button class="' + (tab === 'history' ? 'on' : '') + '" data-action="detail-tab" data-tab="history">历史变更和使用</button></div>';
      var body = tab === 'history' ? recipeHistoryHtml(r) : recipeDetailHtml(r);
      el.modal.innerHTML = '<div class="mask" data-action="detail-close"><div class="modal wide" role="dialog">' +
        '<h3 style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span>' + h.esc(r.name) +
        ' <span class="chip ' + h.esc(r.status) + '">' + h.esc(h.recipeStatusLabel(r.status)) + '</span></span>' + tabs + '</h3>' +
        '<div class="modal-body">' + body + '</div>' +
        '<div class="modal-actions"><button class="btn primary" data-action="detail-close">关闭</button></div>' +
        '</div></div>';
      return;
    }
    var p = state.svc.getProduction(state.detail.id);
    if (!p) { state.detail = null; el.modal.innerHTML = ''; return; }
    el.modal.innerHTML = '<div class="mask" data-action="detail-close"><div class="modal wide" role="dialog">' +
      '<h3>配料记录详情</h3><div class="modal-body">' + productionDetailHtml(p) + '</div>' +
      '<div class="modal-actions"><button class="btn primary" data-action="detail-close">关闭</button></div>' +
      '</div></div>';
  }

  var HIST_TYPE_LABEL = { created: '创建', update: '更新', status: '状态变更' };

  function histTypeLabel(e) {
    if (e.type === 'status') {
      return h.recipeStatusLabel(e.from) + ' → ' + h.recipeStatusLabel(e.to);
    }
    return HIST_TYPE_LABEL[e.type] || String(e.type || '记录');
  }

  function recipeHistoryHtml(r) {
    var hist = (r.history || []).slice().sort(function (a, b) {
      return String(b.at || '').localeCompare(String(a.at || ''));
    });
    if (!hist.length) { return emptyBlock('暂无历史记录'); }
    var updates = hist.filter(function (e) { return e.type !== 'usage'; });
    var usages = hist.filter(function (e) { return e.type === 'usage'; });
    return '<h4 class="detail-sub">更新与状态记录 <span class="muted">' + updates.length + ' 条</span></h4>' +
      (updates.length ? updates.map(histUpdateHtml).join('') : '<p class="muted">暂无更新记录</p>') +
      '<h4 class="detail-sub">使用记录 <span class="muted">' + usages.length + ' 条</span></h4>' +
      (usages.length ? usages.map(histUsageHtml).join('') : '<p class="muted">暂无使用记录，登记配料批次后自动生成。</p>');
  }

  function histUpdateHtml(e) {
    return '<div class="hist-item"><div class="hist-head"><span class="chip">' +
      h.esc(histTypeLabel(e)) + '</span><b>' + h.esc(e.note || '') + '</b>' +
      '<span class="muted">' + h.esc(h.fmtDateTime(e.at)) + ' · ' + h.esc(e.by || '—') + '</span></div>' +
      (e.version ? '<div class="hist-meta">版本 ' + h.esc(e.version) + '</div>' : '') +
      (e.changes && e.changes.length
        ? '<ul class="hist-changes">' + e.changes.map(function (c) { return '<li>' + h.esc(c) + '</li>'; }).join('') + '</ul>'
        : '') +
      '</div>';
  }

  function histUsageHtml(e) {
    var usage = e.usage || [];
    return '<div class="hist-item"><div class="hist-head"><span class="chip">使用</span>' +
      '<b>批次 ' + h.esc(e.batchNo || '—') + '</b>' +
      '<span class="muted">' + h.esc(e.mixDate || '—') + ' · 产线 ' + h.esc(e.line || '—') +
      ' · 操作员 ' + h.esc(e.operator || '—') + '</span></div>' +
      '<div class="hist-meta">记录人 ' + h.esc(e.by || '—') + ' · ' + h.esc(h.fmtDateTime(e.at)) + '</div>' +
      '<table class="mini"><thead><tr><th>物料</th><th>内部编号</th><th>系统料号</th><th>配方量%</th><th>配料用量</th><th>实际量</th><th>单位</th></tr></thead><tbody>' +
      usage.map(function (u) {
        return '<tr><td>' + h.esc(u.name || '—') + '</td>' +
          '<td>' + h.esc(u.intCode || '—') + '</td>' +
          '<td>' + h.esc(u.sysCode || '—') + '</td>' +
          '<td class="num">' + usagePctText(u) + '</td>' +
          '<td class="num">' + usageCalcText(u) + '</td>' +
          '<td class="num">' + (u.actualQty == null ? '—' : h.fmtNum(u.actualQty, 2)) + '</td>' +
          '<td>' + h.esc(u.unit || '') + '</td></tr>';
      }).join('') + '</tbody></table>' +
      '</div>';
  }

  /* SECTION: 全局事件（委托） */
  function bindGlobalEvents() {
    document.addEventListener('click', onClick);
    document.addEventListener('input', onInput);
    document.addEventListener('change', onChange);
    document.addEventListener('submit', onSubmit);
  }

  function onClick(ev) {
    var t = ev.target.closest('[data-action],[data-nav],[data-input]');
    if (!t) { return; }
    if (t.dataset.nav) { state.view = t.dataset.nav; render(); return; }
    var act = t.dataset.action;
    if (!act) { return; }
    var id = t.dataset.id;

    switch (act) {
      /* 账号 */
      case 'logout':
        state.auth.logout();
        state.session = null;
        state.view = 'dashboard';
        flash('已退出登录');
        render();
        break;

      /* 看板 */
      case 'dash-range': state.dashRange = t.dataset.range; render(); break;

      /* 配方 */
      case 'recipe-new':
        state.form = { type: 'recipe', data: { status: 'draft', unit: 'kg', components: [{ qty: '', intCode: '', sysCode: '', unit: 'kg' }] }, errors: {} };
        renderModal(); break;
      case 'recipe-edit':
        openRecipeForm(id); break;
      case 'recipe-view':
        state.detail = { type: 'recipe', id: id, tab: 'detail' };
        renderModal(); break;
      case 'recipe-history':
        state.detail = { type: 'recipe', id: id, tab: 'history' };
        renderModal(); break;
      case 'recipe-update':
        guard('recipe.update', function () {
          var r0 = state.svc.getRecipe(id);
          state.confirm = { title: '发起配方更新', okLabel: '确认更新',
            body: '<p>将为 <b>' + h.esc(r0.name) + '</b>（' + h.esc(r0.id) + ' · ' + h.esc(r0.version) + '）生成新版本草稿；原版本保持生效，新版本审批通过后自动替代旧版。</p>',
            onOk: function () {
              var res = state.svc.createRecipeUpdate(id, state.session);
              if (!res.ok) { flash(res.error, 'err'); return; }
              state.recipeQuery.page = 1;
              flash('已创建更新版本 ' + res.recipe.id + '（' + res.recipe.version + '），请编辑后提交审批');
              openRecipeForm(res.recipe.id);
            } };
          renderModal();
        }); break;
      case 'detail-tab':
        if (state.detail) { state.detail.tab = t.dataset.tab; renderModal(); }
        break;
      case 'detail-close':
        state.detail = null; el.modal.innerHTML = ''; render();
        break;
      case 'recipe-save': saveRecipe(); break;
      case 'recipe-flow':
        var r0 = state.svc.getRecipe(id);
        var next = t.dataset.next;
        /* pending 状态的审批通过/退回修改用 recipe.approve 权限，其余状态流转用 recipe.update */
        var flowPerm = (r0 && r0.status === 'pending') ? 'recipe.approve' : 'recipe.update';
        guard(flowPerm, function () {
          var labels = { pending: ['提交审批', false, '提交后进入待审批状态，审批通过前不可再编辑。'],
            active: ['审批通过', false, '审批通过后配方生效，同谱系旧版本将自动停用；生效后不可直接编辑，只能发起更新。'],
            draft: ['退回修改', false, '退回草稿状态后可继续编辑，编辑后需重新提交审批。'],
            obsolete: ['停用', true, '停用后该配方不再生效，历史记录与已登记批次不受影响。'] };
          var cfg = labels[next] || [h.recipeStatusLabel(next), false, '确认执行该状态变更？'];
          state.confirm = { title: '确认' + cfg[0], okLabel: '确认' + cfg[0], danger: cfg[1],
            body: '<p>配方 <b>' + h.esc(r0.name) + '</b>（' + h.esc(r0.id) + ' · ' + h.esc(r0.version) + '）' + cfg[2] + '</p>',
            onOk: function () {
              var res = state.svc.setRecipeStatus(id, next, state.session);
              if (res.ok) { flash('状态已更新为「' + h.recipeStatusLabel(res.recipe.status) + '」'); render(); }
              else { flash(res.error || '状态流转失败', 'err'); render(); }
            } };
          renderModal();
        }); break;
      case 'recipe-dup':
        guard('recipe.create', function () {
          var r0 = state.svc.getRecipe(id);
          state.confirm = { title: '复制配方', okLabel: '确认复制',
            body: '<p>将复制 <b>' + h.esc(r0.name) + '</b>（' + h.esc(r0.id) + '）为新的草稿配方，可编辑后提交审批。</p>',
            onOk: function () {
              var r = state.svc.duplicateRecipe(id, state.session);
              flash(r.ok ? '已复制为 ' + r.recipe.id : '复制失败');
              if (r.ok) {
                /* 回到第一页看新记录 */
                state.recipeQuery.page = 1; render();
              }
            } };
          renderModal();
        }); break;
      case 'recipe-del':
        guard('recipe.delete', function () { askDeleteRecipe(id, false); }); break;

      /* 生产 */
      case 'prod-new':
        state.form = { type: 'production', data: { planDate: todayStr(), status: 'planned', qcResult: 'pending', inputQty: '', outputQty: 0, qualifiedQty: 0 }, errors: {} };
        renderModal(); break;
      case 'prod-edit':
        openProductionForm(id); break;
      case 'prod-view':
        state.detail = { type: 'production', id: id };
        renderModal(); break;
      case 'prod-save': saveProduction(); break;
      case 'prod-del':
        guard('production.delete', function () {
          state.confirm = { title: '删除配料记录', danger: true, okLabel: '确认删除',
            body: '<p>批次 <b>' + h.esc(findProd(id).batchNo) + '</b> 将被永久删除，无法恢复。</p>',
            onOk: function () { state.svc.deleteProduction(id, state.session); closeAndFlash('已删除'); } };
          renderModal();
        }); break;

      /* 原材料库 */
      case 'mat-new':
        state.matForm = { data: { unit: 'kg' }, errors: {} };
        renderModal(); break;
      case 'mat-edit':
        state.matForm = { id: id, data: Object.assign({}, state.mats.get(id)), errors: {} };
        renderModal(); break;
      case 'mat-save': saveMaterial(); break;
      case 'mat-del':
        guard('material.manage', function () {
          var m = state.mats.get(id);
          state.confirm = { title: '删除原料', danger: true, okLabel: '确认删除',
            body: '<p>原料「<b>' + h.esc(m.name) + '</b>」（' + h.esc(m.intCode || m.sysCode) + '）将从数据库移除。</p>',
            onOk: function () { state.mats.remove(id); closeAndFlash('已删除'); } };
          renderModal();
        }); break;
      case 'mat-export': exportCsv('materials'); break;

      /* 组分行的原料检索 */
      case 'mat-pick': openMaterialPicker(t.dataset.row); break;
      case 'mat-use': useMaterial(t.dataset.mid); break;
      case 'picker-close':
        if (t.classList.contains('mask') && ev.target !== t) { return; }
        state.picker = null; renderModal(); break;
      case 'mat-new-from-picker':
        state.backToPicker = true;
        state.picker = null;
        state.matForm = { data: { unit: 'kg' }, errors: {}, pickerRow: state.lastPickerRow };
        renderModal(); break;

      /* 组分行 */
      case 'comp-add':
        collectFormFromDom();
        state.form.data.components.push({ qty: '', intCode: '', sysCode: '', unit: 'kg' });
        renderModal(); break;
      case 'comp-del':
        collectFormFromDom();
        state.form.data.components.splice(Number(t.dataset.row), 1);
        renderModal(); break;

      /* 调色项 */
      case 'adj-add':
        collectFormFromDom();
        if (!state.form.data.colorAdjust) { state.form.data.colorAdjust = { items: [], note: '' }; }
        state.form.data.colorAdjust.items.push({ material: '', qty: '', reason: '' });
        renderModal(); break;
      case 'adj-del':
        collectFormFromDom();
        state.form.data.colorAdjust.items.splice(Number(t.dataset.row), 1);
        renderModal(); break;

      /* 账号 */
      case 'user-add':
        state.form = { type: 'register', data: { role: 'operator' }, errors: {} };
        el.modal.innerHTML = registerModalHtml();
        break;
      case 'user-register':
        var form = el.modal.querySelector('form[data-form="admin-register"]');
        var result = state.auth.register(readForm(form));
        if (result.ok) { closeAndFlash('账号已创建'); }
        else { state.form.errors = { _: result.error }; el.modal.innerHTML = registerModalHtml(); }
        break;
      case 'user-reset':
        state.confirm = { title: '重置口令', okLabel: '重置',
          body: '<p>为账号 <b>' + h.esc(id) + '</b> 设置新口令：</p><input class="reset-pass" id="reset-pass" type="text" placeholder="新口令，至少 6 位">' +
            '<p class="muted">重置后请告知该同事尽快修改。</p>',
          onOk: function () {
            var v = document.getElementById('reset-pass').value;
            var r = state.auth.resetPassword(id, v, state.session);
            closeAndFlash(r.ok ? '口令已重置' : r.error);
          } };
        renderModal(); break;
      case 'user-del':
        state.confirm = { title: '删除账号', danger: true, okLabel: '删除',
          body: '<p>确定删除账号 <b>' + h.esc(id) + '</b> 吗？此操作无法撤销。</p>',
          onOk: function () {
            var r = state.auth.deleteUser(id, state.session);
            closeAndFlash(r.ok ? '账号已删除' : r.error);
          } };
        renderModal(); break;

      /* 数据 */
      case 'data-export-json': exportJson(); break;
      case 'data-reseed':
        state.confirm = { title: '重置示例数据', danger: true, okLabel: '全部重置',
          body: '<p>当前所有配方、配料记录、原材料库与账号将被清除，恢复为初始示例数据。此操作无法撤销。</p>',
          onOk: function () {
            state.store.reseedDemoData();
            state.auth = authMod.createAuth(state.store);
            state.mats = materialsMod.createMaterials(state.store);
            state.session = null;
            closeAndFlash('已重置，请重新登录');
            render();
          } };
        renderModal(); break;

      case 'recipe-export': exportCsv('recipes'); break;
      case 'prod-export': exportCsv('production'); break;

      /* 分页与排序 */
      case 'page':
        pageOf(t).page = Number(t.dataset.page); render(); break;
      case 'sort':
        sortOf(t, t.dataset.key); render(); break;

      /* 弹窗：遮罩只在点击其本身（非弹窗内容）时关闭 */
      case 'modal-close':
        if (t.classList.contains('mask') && ev.target !== t) { return; }
        if (state.matForm) {
          var backToPk = state.backToPicker;
          state.matForm = null; state.backToPicker = false;
          if (backToPk) {
            state.picker = { row: state.lastPickerRow, keyword: '', hits: state.mats.search('') };
          }
          renderModal(); break;
        }
        state.form = null; state.confirm = null; renderModal(); break;
      case 'confirm-ok':
        var fn = state.confirm && state.confirm.onOk;
        state.confirm = null;
        if (fn) { fn(); }
        render();
        break;
    }
  }

  /* 配方表单：任一用量（含原胶）变化时刷新全部含量%与合计 */
  function refreshRecipePct() {
    var comps = state.form.data.components || [];
    var gumQty = state.form.data.gumQty;
    Array.prototype.forEach.call(el.modal.querySelectorAll('.comp-row[data-row]'), function (rc) {
      var cell = rc.querySelector('.pct-cell');
      if (cell) { cell.textContent = compPct(comps, Number(rc.dataset.row), gumQty); }
    });
    var gumCell = el.modal.querySelector('.comp-row[data-gumrow] .pct-cell');
    if (gumCell) { gumCell.textContent = gumPct(comps, gumQty); }
    updateFormCalc();
  }

  function onInput(ev) {
    var t = ev.target;
    var compRow = t.dataset && t.dataset.comp ? t.closest('.comp-row[data-row]') : null;
    if (compRow && state.form && state.form.type === 'recipe') {
      /* 单格编辑直接写回，避免整表重建丢焦点 */
      var row = Number(compRow.dataset.row);
      if (!state.form.data.components) { state.form.data.components = []; }
      if (!state.form.data.components[row]) { state.form.data.components[row] = {}; }
      state.form.data.components[row][t.dataset.comp] = t.value;
      refreshRecipePct();
      return;
    }
    /* 原胶独立项：写回；用量变化联动全部含量% */
    var gumEl = t.dataset && t.dataset.gum ? 1 : 0;
    if (gumEl && state.form && state.form.type === 'recipe') {
      if (t.dataset.gum === 'qty') { state.form.data.gumQty = t.value; refreshRecipePct(); }
      else if (t.dataset.gum === 'unit') { state.form.data.gumUnit = t.value; }
      else if (t.dataset.gum === 'intCode') { state.form.data.gumIntCode = t.value; }
      else if (t.dataset.gum === 'sysCode') { state.form.data.gumSysCode = t.value; }
      else if (t.dataset.gum === 'name') { state.form.data.gumName = t.value; }
      return;
    }
    /* 目标原胶量变化：按比例重算配料用量（保留已填实际量，不重渲保焦点） */
    if (t.name === 'targetGum' && state.form && state.form.type === 'production') {
      state.form.data.targetGum = t.value;
      var usage = state.form.data.materialUsage || [];
      var recipe = state.svc.getRecipe(state.form.data.recipeId);
      if (recipe && usage.length) {
        var plan = state.svc.usagePlan(recipe.id, t.value);
        plan.forEach(function (pr, i) {
          if (usage[i]) {
            usage[i].planQty = pr.planQty; usage[i].planPct = pr.planPct; usage[i].calcQty = pr.calcQty;
          } else { usage[i] = pr; }
        });
        Array.prototype.forEach.call(el.modal.querySelectorAll('.comp-row[data-urow]'), function (rowEl, i) {
          if (!usage[i]) { return; }
          var pc = rowEl.querySelector('.u-plan');
          if (pc) { pc.textContent = usagePctText(usage[i]); }
          var cc = rowEl.querySelector('.u-calc');
          if (cc) { cc.textContent = usageCalcText(usage[i]); }
          var dc = rowEl.querySelector('.u-diff');
          if (dc) { dc.innerHTML = usageDiffText(usage[i]); }
        });
      }
      return;
    }
    /* 逐原料实际用量：单格写回，同步刷新偏差与合计 */
    var usageRow = t.dataset && t.dataset.usage ? t.closest('.comp-row[data-urow]') : null;
    if (usageRow && state.form && state.form.type === 'production') {
      var ui = Number(usageRow.dataset.urow);
      var usage = state.form.data.materialUsage || [];
      if (usage[ui]) {
        usage[ui][t.dataset.usage] = t.value;
        var diffCell = usageRow.querySelector('.u-diff');
        if (diffCell) { diffCell.innerHTML = usageDiffText(usage[ui]); }
        var totalEl = document.getElementById('usage-total');
        if (totalEl) { totalEl.textContent = h.fmtNum(state.svc.usageTotal(usage), 2); }
      }
      return;
    }
    /* 调色项：单格写回，不重渲以保持焦点 */
    var adjRow = t.dataset && t.dataset.adj ? t.closest('.comp-row[data-arow]') : null;
    if (adjRow && state.form && state.form.type === 'production') {
      var ai = Number(adjRow.dataset.arow);
      var adj = state.form.data.colorAdjust || (state.form.data.colorAdjust = { items: [], note: '' });
      if (adj.items[ai]) { adj.items[ai][t.dataset.adj] = t.value; }
      /* 调色物料名称匹配原材料库时自动填充内部编号（仅当内部编号为空时） */
      if (t.dataset.adj === 'material' && adj.items[ai]) {
        var kw = t.value.trim();
        if (kw) {
          var hits = state.mats.search(kw);
          var match = null;
          for (var mi = 0; mi < hits.length; mi++) {
            if ((hits[mi].name || '') === kw) { match = hits[mi]; break; }
          }
          if (!match && hits.length === 1) { match = hits[0]; }
          if (match) {
            var code = match.intCode || match.sysCode || '';
            adj.items[ai].intCode = code;
            var intEl = adjRow.querySelector('[data-adj="intCode"]');
            if (intEl && !intEl.value.trim()) { intEl.value = code; }
          }
        }
      }
      return;
    }
    var input = t.dataset.input;
    if (input === 'picker-search' && state.picker) {
      clearTimeout(pickerTimer);
      var kw = t.value;
      pickerTimer = setTimeout(function () {
        state.picker.keyword = kw;
        state.picker.hits = state.mats.search(kw);
        renderModal();
        var again = el.modal.querySelector('.picker-search');
        if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
      }, 200);
      return;
    }
    if (input) {
      var map = {
        'recipe-search': ['recipeQuery', 'search'], 'prod-search': ['prodQuery', 'search'],
        'prod-from': ['prodQuery', 'from'], 'prod-to': ['prodQuery', 'to'],
        'mat-search': ['matQuery', 'search']
      }[input];
      if (map) {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(function () {
          state[map[0]][map[1]] = t.value;
          state[map[0]].page = 1;
          render();
          var again = document.querySelector('[data-input="' + input + '"]');
          if (again) { again.focus(); }
        }, 250);
      }
    }
  }
  var debounceTimer = null;
  var pickerTimer = null;

  function onChange(ev) {
    var t = ev.target;
    var input = t.dataset.input;
    if (input && input.indexOf('recipe-') === 0 && input !== 'recipe-search') {
      state.recipeQuery[input.replace('recipe-', '')] = t.value;
      state.recipeQuery.page = 1;
      render();
    } else if (input === 'prod-qc') {
      state.prodQuery.qcResult = t.value;
      state.prodQuery.page = 1;
      render();
    } else if (input === 'sort-recipe' || input === 'sort-prod') {
      /* 保留：未来扩展排序下拉 */
    } else if (input === 'data-import') {
      importJson(t.files && t.files[0]);
    } else if (t.name === 'recipeId' && state.form && state.form.type === 'production') {
      /* 切换配方：按目标原胶量重建逐原料用量清单（保留已填调色记录） */
      collectFormFromDom();
      state.form.data.recipeId = t.value;
      state.form.data.materialUsage = t.value ? state.svc.usagePlan(t.value, state.form.data.targetGum) : [];
      renderModal();
    }
  }

  function onSubmit(ev) {
    ev.preventDefault();
    var form = ev.target;
    if (form.dataset.form === 'login') {
      var r = state.auth.login(form.username.value.trim(), form.password.value);
      var slot = document.getElementById('login-err');
      if (r.ok) { state.session = r.user; render(); }
      else if (slot) { slot.innerHTML = '<div class="err-box"><p>' + h.esc(r.error) + '</p></div>'; }
    }
  }

  function readForm(form) {
    var out = {};
    Array.prototype.forEach.call(form.elements, function (f) {
      if (f.name) { out[f.name] = (f.value || '').trim(); }
    });
    return out;
  }

  function registerModalHtml() {
    var f = state.form;
    return '<div class="mask" data-action="modal-close"><div class="modal" role="dialog">' +
      '<h3>新增账号</h3><form data-form="admin-register" class="grid-1">' +
      field('username', '账号', '<input name="username">') +
      field('displayName', '姓名', '<input name="displayName">') +
      field('role', '角色', roleSelect('role', 'operator')) +
      field('password', '初始口令', '<input name="password" type="text">') +
      '</form><div class="err-slot">' + formErrorsHtml(f.errors) + '</div>' +
      '<div class="modal-actions"><button class="btn ghost" data-action="modal-close">取消</button>' +
      '<button class="btn primary" data-action="user-register">创建</button></div></div></div>';
  }

  /* SECTION: 表单收集与保存 */
  function collectFormFromDom() {
    if (!state.form || !['recipe', 'production'].includes(state.form.type)) { return; }
    var form = el.modal.querySelector('form');
    if (!form) { return; }
    var data = state.form.type === 'recipe'
      ? { components: (state.form.data.components || []).map(function (c) { return Object.assign({}, c); }) }
      : {};
    Array.prototype.forEach.call(form.elements, function (f) {
      if (f.name) { data[f.name] = f.value; }
    });
    if (state.form.type === 'recipe') {
      el.modal.querySelectorAll('.comp-row[data-row]').forEach(function (rowEl) {
        var i = Number(rowEl.dataset.row);
        if (!data.components[i]) { data.components[i] = {}; }
        rowEl.querySelectorAll('[data-comp]').forEach(function (inp) {
          data.components[i][inp.dataset.comp] = inp.value;
        });
      });
      /* 原胶独立项 */
      var gumQtyEl = el.modal.querySelector('[data-gum="qty"]');
      var gumUnitEl = el.modal.querySelector('[data-gum="unit"]');
      var gumIntEl = el.modal.querySelector('[data-gum="intCode"]');
      var gumSysEl = el.modal.querySelector('[data-gum="sysCode"]');
      var gumNameEl = el.modal.querySelector('[data-gum="name"]');
      if (gumQtyEl) { data.gumQty = gumQtyEl.value; }
      if (gumUnitEl) { data.gumUnit = gumUnitEl.value; }
      if (gumIntEl) { data.gumIntCode = gumIntEl.value; }
      if (gumSysEl) { data.gumSysCode = gumSysEl.value; }
      if (gumNameEl) { data.gumName = gumNameEl.value; }
    }
    if (state.form.type === 'production') {
      /* 逐原料实际用量 */
      var usage = (state.form.data.materialUsage || []).map(function (u) { return Object.assign({}, u); });
      el.modal.querySelectorAll('.comp-row[data-urow]').forEach(function (rowEl) {
        var i = Number(rowEl.dataset.urow);
        if (!usage[i]) { usage[i] = {}; }
        rowEl.querySelectorAll('[data-usage]').forEach(function (inp) {
          usage[i][inp.dataset.usage] = inp.value;
        });
      });
      data.materialUsage = usage;
      /* 调色项与说明 */
      var adj = state.form.data.colorAdjust || { items: [], note: '' };
      var items = (adj.items || []).map(function (it) { return Object.assign({}, it); });
      el.modal.querySelectorAll('.comp-row[data-arow]').forEach(function (rowEl) {
        var i = Number(rowEl.dataset.arow);
        if (!items[i]) { items[i] = {}; }
        rowEl.querySelectorAll('[data-adj]').forEach(function (inp) {
          items[i][inp.dataset.adj] = inp.value;
        });
      });
      var noteEl = el.modal.querySelector('[name="colorNote"]');
      data.colorAdjust = { items: items, note: noteEl ? noteEl.value : (adj.note || '') };
    }
    state.form.data = Object.assign({}, state.form.data, data);
  }

  function openRecipeForm(id) {
    var r = state.svc.getRecipe(id);
    if (!r) { return; }
    state.form = { type: 'recipe', id: id, data: JSON.parse(JSON.stringify(r)), errors: {} };
    renderModal();
  }

  function openProductionForm(id) {
    var p = state.svc.getProduction(id);
    if (!p) { return; }
    var d = JSON.parse(JSON.stringify(p));
    /* 历史记录没有逐原料用量时，按当前配方 + 目标原胶量回填计划量 */
    if (!Array.isArray(d.materialUsage) || !d.materialUsage.length) {
      d.materialUsage = state.svc.usagePlan(d.recipeId, d.targetGum);
    }
    if (!d.colorAdjust || !Array.isArray(d.colorAdjust.items)) {
      d.colorAdjust = { items: [], note: '' };
    }
    state.form = { type: 'production', id: id, data: d, errors: {} };
    renderModal();
  }

  function saveRecipe() {
    collectFormFromDom();
    guard(state.form.id ? 'recipe.update' : 'recipe.create', function () {
      var d = normalizeRecipeData(state.form.data);
      var res = state.form.id
        ? state.svc.updateRecipe(state.form.id, d, state.session)
        : state.svc.createRecipe(d, state.session);
      if (res.ok) {
        closeAndFlash(state.form.id ? '配方已更新' : '配方已创建：' + res.recipe.id);
        state.form = null; render();
      } else {
        state.form.errors = res.errors || {};
        renderModal();
      }
    }, function () { state.form.errors = { _: '没有该操作权限' }; renderModal(); });
  }

  function normalizeRecipeData(d) {
    var out = Object.assign({}, d);
    /* 历史记录由服务层统一维护，表单数据不携带旧历史，避免覆盖审计日志 */
    delete out.history;
    out.gumQty = (d.gumQty === '' || d.gumQty == null) ? '' : numOr(d.gumQty);
    if (!out.gumUnit) { out.gumUnit = d.gumUnit || out.unit || 'kg'; }
    out.gumIntCode = (d.gumIntCode === '' || d.gumIntCode == null) ? '' : String(d.gumIntCode);
    out.gumSysCode = (d.gumSysCode === '' || d.gumSysCode == null) ? '' : String(d.gumSysCode);
    out.gumName = (d.gumName === '' || d.gumName == null) ? '' : String(d.gumName);
    out.gumMaterialId = d.gumMaterialId || '';
    out.components = (d.components || []).map(function (c) {
      return {
        name: c.name || '',
        intCode: c.intCode || c.materialCode || '',
        sysCode: c.sysCode || '',
        materialCode: c.materialCode || '',
        materialId: c.materialId || '',
        unit: c.unit || out.unit || 'kg',
        qty: numOr(c.qty)
      };
    });
    return out;
  }

  function saveProduction() {
    collectFormFromDom();
    guard(state.form.id ? 'production.update' : 'production.create', function () {
      var d = Object.assign({}, state.form.data);
      ['inputQty', 'outputQty', 'qualifiedQty', 'targetGum'].forEach(function (k) {
        if (d[k] === '' || d[k] == null) { d[k] = ''; } else { d[k] = numOr(d[k]); }
      });
      if (!d.qcResult) { d.qcResult = 'pending'; }
      var res = state.form.id
        ? state.svc.updateProduction(state.form.id, d, state.session)
        : state.svc.createProduction(d, state.session);
      if (res.ok) {
        closeAndFlash(state.form.id ? '记录已更新' : '批次已登记：' + res.record.batchNo);
        state.form = null; render();
      } else {
        state.form.errors = res.errors || (res.error ? { _: res.error } : {});
        renderModal();
      }
    }, function () { state.form.errors = { _: '没有该操作权限' }; renderModal(); });
  }

  function findProd(id) {
    return state.svc.listProduction().filter(function (p) { return p.id === id; })[0];
  }

  function askDeleteRecipe(id, force) {
    var r = state.svc.getRecipe(id);
    if (!r) { return; }
    var linked = state.svc.queryProduction({ recipeId: id }).total;
    state.confirm = {
      title: '删除配方', danger: true, okLabel: force || !linked ? '确认删除' : '仍然删除',
      body: '<p>确认删除「<b>' + h.esc(r.name) + '</b>」（' + h.esc(r.id) + '）？</p>' +
        (linked ? '<p class="warn">该配方关联 <b>' + linked + '</b> 条配料记录，删除记录仍会保留历史引用。</p>' : ''),
      onOk: function () {
        var res = state.svc.deleteRecipe(id, state.session, force || linked > 0);
        if (res.needConfirm) {
          askDeleteRecipe(id, true);
        } else {
          closeAndFlash(res.ok ? '配方已删除' : res.error);
        }
      } };
    renderModal();
  }

  /* SECTION: 导出 / 导入 */
  function exportCsv(which) {
    var cols, rows, name;
    if (which === 'recipes') {
      cols = [
        { key: 'id', label: '编号' }, { key: 'name', label: '名称' }, { key: 'category', label: '类目' },
        { key: 'status', label: '状态', formatter: function (r) { return h.recipeStatusLabel(r.status); } },
        { key: 'version', label: '版本' }, { key: 'unit', label: '单位' },
        { key: 'components', label: '组分（内部编号/系统料号/含量%）', formatter: function (r) {
          var comps = r.components || [];
          var gum = numOr(r.gumQty);
          var total = comps.reduce(function (s, c) { return s + numOr(c.qty); }, 0) + gum;
          var parts = [];
          if (gum > 0) {
            var gPct = total > 0 ? (gum / total * 100).toFixed(1) + '%' : '';
            parts.push((r.gumName || '原胶') + ' ' + h.fmtNum(gum, 2) + (r.gumUnit || r.unit || 'kg') + ' [' +
              (r.gumIntCode || '') + '/' + (r.gumSysCode || '') + ' ' + gPct + ']');
          }
          parts = parts.concat(comps.map(function (c) {
            var pct = total > 0 ? (numOr(c.qty) / total * 100).toFixed(1) + '%' : '';
            return c.name + ' ' + h.fmtNum(c.qty, 2) + (c.unit || '') + ' [' +
              (c.intCode || c.materialCode || '') + '/' + (c.sysCode || '') + ' ' + pct + ']';
          }));
          return parts.join(' / ');
        } },
        { key: 'gumQty', label: '原胶用量', formatter: function (r) {
          return numOr(r.gumQty) > 0 ? h.fmtNum(r.gumQty, 2) + (r.gumUnit || r.unit || 'kg') : '—';
        } },
        { key: 'updatedAt', label: '更新时间' }
      ];
      rows = state.svc.queryRecipes(Object.assign({}, state.recipeQuery, { page: 1, pageSize: 5000 })).items;
      name = '配方清单';
    } else if (which === 'production') {
      cols = [
        { key: 'batchNo', label: '批次号' }, { key: 'id', label: '记录号' },
        { key: 'recipeName', label: '配方' }, { key: 'planDate', label: '配料日期' },
        { key: 'line', label: '产线' }, { key: 'operator', label: '操作员' },
        { key: 'targetGum', label: '目标原胶量', formatter: function (p) {
          return (p.targetGum === '' || p.targetGum == null) ? '—' : h.fmtNum(p.targetGum, 2);
        } },
        { key: 'inputQty', label: '投料量' }, { key: 'outputQty', label: '产出量' },
        { key: 'qualifiedQty', label: '合格量' },
        { key: 'yield', label: '得率%', formatter: function (p) { return state.svc.productionYield(p).toFixed(1); } },
        { key: 'pass', label: '合格率%', formatter: function (p) { return state.svc.productionPassRate(p).toFixed(1); } },
        { key: 'qcResult', label: '质检', formatter: function (p) { return h.qcLabel(p.qcResult); } },
        { key: 'usage', label: '原料配料用量', formatter: function (p) {
          return (p.materialUsage || []).map(function (u) {
            var act = (u.actualQty === '' || u.actualQty == null) ? '—' : h.fmtNum(u.actualQty, 2);
            return (u.name || '') + ':配方量%' + usagePctText(u) + '/配料' + usageCalcText(u) + '/实际' + act;
          }).join(' / ');
        } },
        { key: 'adjust', label: '调色记录', formatter: function (p) {
          var adj = p.colorAdjust;
          if (!adj) { return ''; }
          var items = (adj.items || []).map(function (it) {
            return (it.material || '') + (it.intCode ? '[' + it.intCode + ']' : '') + '+' + h.fmtNum(it.qty, 2) + (it.reason ? '(' + it.reason + ')' : '');
          }).join(' / ');
          return [items, adj.note].filter(Boolean).join(' | ');
        } },
        { key: 'remarks', label: '备注' }
      ];
      rows = state.svc.queryProduction(Object.assign({}, state.prodQuery, { page: 1, pageSize: 5000 })).items;
      name = '配料记录';
    } else if (which === 'materials') {
      cols = [
        { key: 'sysCode', label: '系统料号' }, { key: 'intCode', label: '内部编号' },
        { key: 'name', label: '名称' }, { key: 'fullName', label: '全称' },
        { key: 'unit', label: '单位' }, { key: 'unitPrice', label: '参考单价' },
        { key: 'source', label: '来源', formatter: function (m) { return m.source === 'manual' ? '手工添加' : 'Excel导入'; } }
      ];
      rows = state.mats.query(Object.assign({}, state.matQuery, { page: 1, pageSize: 5000 })).items;
      name = '原材料清单';
    }
    download(name + '_' + todayStr() + '.csv', '\ufeff' + h.buildCsv(rows, cols), 'text/csv');
    flash('已导出 ' + rows.length + ' 行 CSV');
  }

  function exportJson() {
    var snapshot = state.store.exportAll();
    download('配方管理备份_' + todayStr() + '.json', JSON.stringify(snapshot, null, 2), 'application/json');
    flash('已导出全量备份');
  }

  function download(filename, text, mime) {
    var blob = new Blob([text], { type: mime + ';charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
  }

  function importJson(file) {
    if (!file) { return; }
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var snapshot = JSON.parse(String(reader.result));
        state.store.importAll(snapshot);
        state.auth = authMod.createAuth(state.store);
        state.mats = materialsMod.createMaterials(state.store);
        state.svc = service.createService(state.store);
        state.svc.migrateData();
        state.session = null;
        closeAndFlash('导入成功，请使用备份中的账号重新登录');
        render();
      } catch (e) {
        flash('导入失败：' + (e.message || '文件格式不正确'), 'err');
      }
    };
    reader.readAsText(file, 'utf-8');
  }

  /* SECTION: 工具 */
  function guard(perm, onOk, onDenied) {
    if (state.auth.can(state.session, perm)) { onOk(); }
    else if (onDenied) { onDenied(); }
    else { flash('当前角色没有该操作权限', 'err'); }
  }

  function flash(text, kind) {
    state.flash = { text: text, kind: kind || 'ok' };
    renderFlash();
  }

  function closeAndFlash(text, kind) {
    state.form = null; state.confirm = null;
    flash(text, kind);
    render();
  }

  function renderFlash() {
    if (!state.flash) { el.flash.innerHTML = ''; return; }
    el.flash.innerHTML = '<div class="toast ' + state.flash.kind + '">' + h.esc(state.flash.text) + '</div>';
    var f = state.flash;
    setTimeout(function () {
      if (state.flash === f) { state.flash = null; el.flash.innerHTML = ''; }
    }, 2600);
  }

  function todayStr() {
    var d = new Date();
    function p2(x) { return (x < 10 ? '0' : '') + x; }
    return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
  }

  function nowLocal() {
    return todayStr() + 'T' + (function () {
      var d = new Date();
      function p2(x) { return (x < 10 ? '0' : '') + x; }
      return p2(d.getHours()) + ':' + p2(d.getMinutes());
    })();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})(window);

</script>
</body>
</html>
