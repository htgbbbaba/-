<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f6b5c'/%3E%3Cpath d='M26 14h12M28 14v14l-12 18a6 6 0 0 0 5 9h18a6 6 0 0 0 5-9L36 28V14' fill='none' stroke='white' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cline x1='24' y1='40' x2='40' y2='40' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<title>配方管理与配料记录</title>
<style>
/* SECTION: tokens */
:root {
  --bg: #f2f4f7;
  --panel: #ffffff;
  --ink: #1c2433;
  --ink-2: #5b6678;
  --ink-3: #8b96a8;
  --line: #e3e8ef;
  --accent: #0f6b5c;
  --accent-2: #12857a;
  --accent-soft: #e2f1ee;
  --danger: #c2413b;
  --warn: #b97a17;
  --ok: #2e7d4f;
  --c-done: #2e9e6b;
  --c-run: #3b82d6;
  --c-qc: #d9a13c;
  --c-plan: #97a3b6;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(23,34,53,.05), 0 4px 16px rgba(23,34,53,.06);
  --font: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.55;
}

/* SECTION: shell */
#topnav {
  display: flex; align-items: center; gap: 18px;
  position: sticky; top: 0; z-index: 30;
  background: #14202e; color: #e8edf4;
  padding: 0 20px; height: 56px;
  box-shadow: 0 2px 8px rgba(10,18,28,.25);
}
#topnav .brand { display: flex; align-items: center; gap: 9px; flex: none; }
.brand-mark {
  width: 30px; height: 30px; border-radius: 8px; flex: none;
  background: linear-gradient(135deg, var(--accent-2), var(--accent));
  color: #fff; font-weight: 700; display: grid; place-items: center; font-size: 15px;
}
.brand-mark.big { width: 46px; height: 46px; border-radius: 12px; font-size: 22px; }
.brand-text { font-weight: 600; letter-spacing: .02em; white-space: nowrap; }
#topnav .tabs { display: flex; gap: 4px; flex: 1; overflow-x: auto; scrollbar-width: none; }
#topnav .tabs::-webkit-scrollbar { display: none; }
.tab {
  border: 0; background: transparent; color: #aeb9c9;
  padding: 8px 14px; border-radius: 8px; font-size: 14px; cursor: pointer;
  font-family: inherit; white-space: nowrap; transition: background .15s, color .15s;
}
.tab:hover { color: #fff; background: rgba(255,255,255,.08); }
.tab.active { color: #fff; background: var(--accent); }
.userbox { display: flex; align-items: center; gap: 10px; flex: none; }
.avatar {
  width: 32px; height: 32px; border-radius: 50%; flex: none;
  background: linear-gradient(135deg, #4d7dad, #2f5d8a); color: #fff;
  display: grid; place-items: center; font-weight: 600;
}
.user-meta { display: flex; flex-direction: column; line-height: 1.2; }
.user-meta b { font-size: 13px; }
.user-meta em { font-style: normal; font-size: 11px; color: #93a1b5; }

#view { max-width: 1280px; margin: 0 auto; padding: 22px 20px 60px; }

/* SECTION: toast */
#flash { position: fixed; top: 66px; left: 50%; transform: translateX(-50%); z-index: 90; pointer-events: none; }
.toast {
  background: #1f2b3a; color: #fff; padding: 9px 18px; border-radius: 999px;
  box-shadow: 0 6px 24px rgba(10,18,28,.3); font-size: 13px;
  animation: toast-in .25s ease;
}
.toast.err { background: var(--danger); }
.toast.ok { background: #223f33; }
@keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; } }

/* SECTION: page head & toolbar */
.page-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
.page-head h2 { margin: 0; font-size: 20px; }
.muted { color: var(--ink-3); font-size: 12.5px; }
.warn { color: var(--warn); }

.toolbar {
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 10px 12px; margin-bottom: 14px; box-shadow: var(--shadow);
}
.toolbar .search { flex: 1 1 220px; min-width: 180px; }
.daterange { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; }

input, select, textarea {
  font-family: inherit; font-size: 14px; color: var(--ink);
  background: #fff; border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 10px; outline: none; transition: border-color .15s, box-shadow .15s;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
}
textarea { resize: vertical; }
input[type="date"], input[type="datetime-local"] { font-size: 13px; }

/* SECTION: buttons */
.btn {
  font-family: inherit; font-size: 14px; cursor: pointer;
  border: 1px solid var(--line); background: #fff; color: var(--ink);
  padding: 8px 14px; border-radius: 8px; transition: filter .15s, background .15s, border-color .15s;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { filter: brightness(.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-2); }
.btn.ghost { background: transparent; }
.btn.danger { background: #fdf1f0; border-color: #f0c9c6; color: var(--danger); }
.btn.accent { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn.xs { padding: 3px 9px; font-size: 12px; border-radius: 6px; }
.btn.block { width: 100%; justify-content: center; padding: 10px; font-size: 15px; }
.btn.file { position: relative; overflow: hidden; }
.btn.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
#topnav .btn.ghost { color: #cfd8e4; border-color: rgba(255,255,255,.22); }
#topnav .btn.ghost:hover { background: rgba(255,255,255,.08); color: #fff; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

.seg { display: inline-flex; background: #e9edf3; border-radius: 9px; padding: 3px; gap: 2px; }
.seg button {
  border: 0; background: transparent; padding: 6px 14px; border-radius: 7px;
  font-size: 13px; color: var(--ink-2); cursor: pointer; font-family: inherit;
}
.seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(20,30,45,.12); font-weight: 600; }
.seg.small button { padding: 4px 11px; font-size: 12.5px; }

/* SECTION: kpi */
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
.kpi {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 2px;
}
.kpi-label { color: var(--ink-2); font-size: 12.5px; }
.kpi-value { font-size: 26px; font-weight: 700; letter-spacing: -.01em; color: var(--ink); }
.kpi-sub { color: var(--ink-3); font-size: 12px; }

/* SECTION: panels & charts */
.card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; box-shadow: var(--shadow); min-width: 0;
}
.panel h3 { margin: 0 0 12px; font-size: 15px; color: var(--ink); }
.chart { width: 100%; height: auto; display: block; }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.chart .axis { stroke: var(--line); stroke-width: 1; }
.chart .dot { fill: var(--accent); stroke: #fff; stroke-width: 1.6; }
.axis-x { display: flex; justify-content: space-between; color: var(--ink-3); font-size: 11px; margin-top: 4px; flex-wrap: wrap; gap: 2px 8px; }

.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 34%) 1fr 64px; gap: 10px; align-items: center; }
.bar-label { font-size: 13px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { height: 10px; background: #edf0f5; border-radius: 999px; overflow: hidden; }
.bar-track i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); border-radius: 999px; }
.bar-val { font-size: 12.5px; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }

.donut-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.donut { width: 140px; height: 140px; flex: none; }
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; font-size: 13px; color: var(--ink-2); }
.legend li { display: flex; align-items: center; gap: 8px; }
.legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.legend b { color: var(--ink); margin-left: 2px; }

.kv-list { display: flex; flex-direction: column; gap: 8px; }
.kv { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--line); padding-bottom: 6px; font-size: 13.5px; color: var(--ink-2); }
.kv b { color: var(--ink); font-variant-numeric: tabular-nums; }

/* SECTION: tables */
.table-wrap {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden;
}
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
thead th {
  text-align: left; color: var(--ink-2); font-weight: 600; font-size: 12.5px;
  background: #f7f9fc; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap;
}
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--accent); }
tbody td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: #f9fbfd; }
td.num, .num, thead th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.dim { color: var(--ink-3); font-size: 12.5px; }
.sub { display: block; font-style: normal; color: var(--ink-3); font-size: 12px; margin-top: 1px; }
.row-actions { display: flex; gap: 6px; flex-wrap: nowrap; justify-content: flex-end; white-space: nowrap; }

.mini { font-size: 13px; }
.mini thead th { padding: 7px 10px; }
.mini tbody td { padding: 7px 10px; }

.pager { display: flex; align-items: center; gap: 6px; padding: 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.pg { border: 1px solid var(--line); background: #fff; min-width: 30px; padding: 5px 8px; border-radius: 7px; cursor: pointer; font-family: inherit; font-size: 13px; }
.pg.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

/* SECTION: chips */
.chip {
  display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 500;
  background: #eef1f6; color: var(--ink-2); white-space: nowrap;
}
.chip.draft { background: #eef1f6; color: #5b6678; }
.chip.pending { background: #fdf3e2; color: var(--warn); }
.chip.active { background: #e5f4ec; color: var(--ok); }
.chip.obsolete { background: #f3f0ef; color: #9a8f8a; }
.chip.planned { background: #eef1f6; color: #5b6678; }
.chip.in_progress { background: #e7f0fb; color: #2f6bb0; }
.chip.qc_check { background: #fdf3e2; color: var(--warn); }
.chip.completed { background: #e5f4ec; color: var(--ok); }
.chip.qc-pass { background: #e5f4ec; color: var(--ok); }
.chip.qc-fail { background: #fdecea; color: var(--danger); }
.chip.qc-pending { background: #eef1f6; color: #5b6678; }
.chip.role-admin { background: #ede9fe; color: #6d4fc4; }
.chip.role-engineer { background: #e7f0fb; color: #2f6bb0; }
.chip.role-operator { background: #e5f4ec; color: var(--ok); }
.chip.role-viewer { background: #eef1f6; color: #5b6678; }
td .chip + .chip { margin-left: 6px; }

.empty { text-align: center; color: var(--ink-3); padding: 34px 16px; }
.empty span { font-size: 26px; display: block; margin-bottom: 6px; color: #c6cfdb; }
.empty p { margin: 0; font-size: 13.5px; }

/* SECTION: login */
.login-wrap { min-height: calc(100vh - 140px); display: grid; place-items: center; padding: 30px 0; }
.login-card {
  width: min(440px, 100%); background: var(--panel); border: 1px solid var(--line);
  border-radius: 16px; box-shadow: 0 10px 40px rgba(20,32,50,.10); padding: 30px 30px 24px;
}
.login-head { text-align: center; margin-bottom: 20px; }
.login-head .brand-mark { margin: 0 auto 10px; }
.login-head h1 { font-size: 19px; margin: 0 0 4px; }
.login-head p { margin: 0; color: var(--ink-3); font-size: 13px; }
.login-card .seg { width: 100%; margin-bottom: 18px; }
.login-card .seg button { flex: 1; }
.grid-1 { display: flex; flex-direction: column; gap: 4px; }
.field { display: block; margin-bottom: 12px; }
.field > span { display: block; font-size: 12.5px; color: var(--ink-2); margin-bottom: 5px; }
.field input, .field select, .field textarea { width: 100%; }
.field .field-err { display: block; font-style: normal; color: var(--danger); font-size: 12px; margin-top: 4px; min-height: 0; }
.err-box { background: #fdecea; border: 1px solid #f2c6c2; color: var(--danger); border-radius: 8px; padding: 8px 12px; margin: 4px 0 10px; font-size: 12.5px; }
.err-box p { margin: 2px 0; }
.err-slot:empty { display: none; }
.demo-accounts { margin-top: 18px; border-top: 1px dashed var(--line); padding-top: 14px; }
.demo-accounts h3 { font-size: 12.5px; color: var(--ink-3); margin: 0 0 8px; font-weight: 600; }
.demo-accounts ul { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 5px 12px; font-size: 12px; color: var(--ink-2); }
.demo-accounts .tip { font-size: 12px; color: var(--ink-3); margin: 10px 0 0; text-align: center; }

/* SECTION: modal & forms */
.mask {
  position: fixed; inset: 0; background: rgba(15,22,32,.45); z-index: 50;
  display: grid; place-items: center; padding: 18px; overflow: auto;
  animation: mask-in .18s ease;
}
@keyframes mask-in { from { opacity: 0; } }
.modal {
  background: var(--panel); border-radius: 14px; box-shadow: 0 18px 60px rgba(10,18,28,.28);
  width: min(520px, 100%); max-height: calc(100vh - 40px); overflow: auto; padding: 20px 22px;
  animation: modal-in .2s ease;
}
.modal.wide { width: min(860px, 100%); }
@keyframes modal-in { from { opacity: 0; transform: translateY(12px) scale(.98); } }
.modal h3 { margin: 0 0 14px; font-size: 16.5px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.modal-body p { margin: 6px 0; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.span-2 { grid-column: span 2; }
.detail-meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--ink-3); margin-bottom: 12px; }
.detail-meta b { color: var(--ink); font-weight: 600; }
.detail-total { display: flex; gap: 22px; flex-wrap: wrap; background: var(--accent-soft); border-radius: 8px; padding: 9px 13px; font-size: 13px; color: var(--ink-2); margin-top: 10px; }
.detail-total b { color: var(--accent); }
.detail-p { font-size: 13px; color: var(--ink-2); margin: 8px 0; }
.reset-pass { width: 100%; margin: 8px 0; }

.comp-head { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 8px; }
.comp-head h4 { margin: 0; font-size: 13.5px; color: var(--ink-2); }
.comp-name-cell { display: flex; gap: 6px; align-items: center; min-width: 0; }
.comp-name-cell input { flex: 1; min-width: 0; }
.btn.xs.pick { background: var(--accent-soft); border-color: transparent; color: var(--accent); flex: none; }
.btn.xs.pick:hover { filter: brightness(.95); }

/* 原料检索浮层 */
.modal.picker { width: min(640px, 100%); }
.picker-search { width: 100%; margin-bottom: 10px; }
.picker-list { max-height: 320px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
.picker-row {
  display: grid; grid-template-columns: minmax(120px, 1.4fr) minmax(140px, 1.6fr) 76px;
  gap: 10px; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--line);
  cursor: pointer; font-size: 13px;
}
.picker-row:last-child { border-bottom: 0; }
.picker-row:hover { background: var(--accent-soft); }
.picker-row b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.picker-row .codes { color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }
.picker-row .price { text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.chip.src-excel { background: #eef1f6; color: #5b6678; }
.chip.src-manual { background: var(--accent-soft); color: var(--accent); }
.comp-table { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.comp-row {
  display: grid; grid-template-columns: 1.6fr 1fr 1fr .8fr .6fr .8fr 30px;
  gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); align-items: center; position: relative;
}
.comp-row:last-child { border-bottom: 0; }
.comp-row.head { background: #f7f9fc; font-size: 12px; color: var(--ink-2); font-weight: 600; padding: 7px 10px; }
.comp-row input { padding: 6px 8px; font-size: 13px; min-width: 0; }
.comp-row.bad { background: #fff8f7; }
.row-err { position: static; grid-column: 1 / -1; font-style: normal; color: var(--danger); font-size: 12px; }
.sub-cell { text-align: right; font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--ink-2); }
.form-calc {
  display: flex; gap: 18px; flex-wrap: wrap; background: #f7f9fc; border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 12px; font-size: 12.5px; color: var(--ink-2); margin-top: 12px;
}
.form-calc b { color: var(--accent); font-variant-numeric: tabular-nums; }

/* 逐原料用量表（8 列）与调色表（4 列） */
.comp-row.u-head, .comp-row[data-urow] { grid-template-columns: 1.3fr .8fr .8fr .62fr .8fr .8fr .45fr .66fr; }
.comp-row.a-head, .comp-row[data-arow] { grid-template-columns: 1.2fr .8fr .7fr 1.4fr 30px; }
.u-name { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.u-code { color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.u-plan, .u-calc, .u-unit { text-align: right; font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--ink-2); }
.u-calc { font-weight: 600; color: var(--ink); }
.u-diff { text-align: right; font-variant-numeric: tabular-nums; font-size: 12.5px; }
.diff-ok { color: var(--ink-3); }
.diff-up { color: var(--warn); font-weight: 600; }
.diff-down { color: var(--danger); font-weight: 600; }
/* 原胶：配方组分清单中的首行折算锚点 */
.gum-row { background: var(--accent-soft); }
.gum-row .gum-label { font-weight: 600; color: var(--accent); }
.gum-row .gum-hint { font-size: 12px; color: var(--ink-3); align-self: center; text-align: right; }
.gum-row .pct-cell { color: var(--accent); font-weight: 600; }
.gum-tr td { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.detail-sub { margin: 14px 0 6px; font-size: 13.5px; color: var(--ink); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.comp-head .btn-row { align-items: center; }

/* SECTION: 历史变更与使用 */
.hist-item { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
.hist-item:last-child { margin-bottom: 0; }
.hist-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13.5px; }
.hist-changes { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--ink-2); }
.hist-changes li { margin: 2px 0; }
.hist-item .mini { margin-top: 8px; }
.hist-meta { font-size: 12px; color: var(--ink-3); margin-top: 2px; }

/* SECTION: responsive */
@media (max-width: 980px) {
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .card-grid { grid-template-columns: 1fr; }
  .grid-2 { grid-template-columns: 1fr; }
  .span-2 { grid-column: auto; }
}
@media (max-width: 700px) {
  #topnav { padding: 0 12px; gap: 10px; }
  .brand-text { display: none; }
  .user-meta { display: none; }
  #view { padding: 16px 12px 50px; }
  .table-wrap { overflow-x: auto; }
  table { min-width: 640px; }
  .comp-row { grid-template-columns: 1fr 1fr; }
  .comp-row.u-head, .comp-row[data-urow],
  .comp-row.a-head, .comp-row[data-arow] { grid-template-columns: 1fr 1fr; }

      if (!String(input.displayName || '').trim()) { return '请填写姓名'; }
      if (String(input.password || '').length < 6) { return '口令至少 6 位'; }
      if (!PERMISSIONS[input.role]) { return '角色无效'; }
      return null;
    }

    function register(input) {
      var problem = validateRegister(input);
      if (problem) { return { ok: false, error: problem }; }
      if (findUser(input.username)) { return { ok: false, error: '账号已存在' }; }
      var users = listUsers();
      var salt = randomSalt();
      users.push({
        username: String(input.username).toLowerCase(),
        displayName: String(input.displayName).trim(),
        role: input.role,
        salt: salt,
        hash: hashPassword(String(input.password), salt),
        createdAt: new Date(now()).toISOString()
      });
      store.writeCollection('users', users);
      return { ok: true };
    }

    function resetPassword(username, newPassword, actor) {
      if (!can(actor, 'user.manage')) { return { ok: false, error: '没有账号管理权限' }; }
      if (String(newPassword || '').length < 6) { return { ok: false, error: '口令至少 6 位' }; }
      var users = listUsers();
      var found = false;
      var next = users.map(function (u) {
        if (String(u.username).toLowerCase() !== String(username).toLowerCase()) { return u; }
        found = true;
        var salt = randomSalt();
        return Object.assign({}, u, { salt: salt, hash: hashPassword(String(newPassword), salt) });
      });
      if (!found) { return { ok: false, error: '账号不存在' }; }
      store.writeCollection('users', next);
      return { ok: true };
    }

    function deleteUser(username, actor) {
      if (!can(actor, 'user.manage')) { return { ok: false, error: '没有账号管理权限' }; }
      if (!username) { return { ok: false, error: '账号不能为空' }; }
      if (actor && String(actor.username).toLowerCase() === String(username).toLowerCase()) {
        return { ok: false, error: '不能删除当前登录账号' };
      }
      var target = findUser(username);
      if (!target) { return { ok: false, error: '账号不存在' }; }
      var admins = listUsers().filter(function (u) { return u.role === 'admin'; });
      if (target.role === 'admin' && admins.length <= 1) {
        return { ok: false, error: '不能删除最后一个管理员账号' };
      }
      var users = listUsers().filter(function (u) {
        return String(u.username).toLowerCase() !== String(username).toLowerCase();
      });
      store.writeCollection('users', users);
      return { ok: true };
    }

    /* SECTION: 权限判定 */
    function can(actor, permission) {
      if (!actor || !PERMISSIONS[actor.role]) { return false; }
      return PERMISSIONS[actor.role].indexOf(permission) !== -1;
    }

    return {
      listUsers: listUsers,
      findUser: findUser,
      login: login,
      logout: logout,
      currentSession: currentSession,
      register: register,
      resetPassword: resetPassword,
      deleteUser: deleteUser,
      hashPassword: hashPassword,
      can: can,
      roleLabel: function (role) { return ROLE_LABELS[role] || role; },
      ROLES: Object.keys(PERMISSIONS),
      SESSION_TTL_MS: SESSION_TTL_MS
    };
  }

  return { createAuth: createAuth, hashPassword: hashPassword };
});

<script>
/* SECTION: service
 * 业务服务层：配方 CRUD 与状态流转、组分成本、生产记录与批次号、
 * 列表筛选/排序/分页、看板聚合、表单校验。
 * 浏览器通过 RPM.service 暴露，Node 测试通过 module.exports 引入。
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) {
    module.exports = factory();
  } else {
    root.RPM = root.RPM || {};
    root.RPM.service = factory();
  }
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  var RECIPE_FLOW = {
    draft: ['pending'],
    pending: ['active', 'draft'],
    active: ['obsolete'],
    obsolete: []
  };
  var PRODUCTION_FLOW = {
    planned: ['in_progress'],
    in_progress: ['qc_check'],
    qc_check: ['completed'],
    completed: []
  };

  function num(v) {
    var n = Number(v);
    return Number.isFinite(n) ? n : 0;
  }

  function pad(n, len) {
    var s = String(n);
    while (s.length < len) { s = '0' + s; }
    return s;
  }

  /* 配方已移除的字段：保质期、储存条件、工艺说明 */
  var REMOVED_RECIPE_FIELDS = ['shelfLife', 'storage', 'process'];
  function stripRemoved(recipe) {
    REMOVED_RECIPE_FIELDS.forEach(function (k) { delete recipe[k]; });
    return recipe;
  }

  /* 版本号递增：V3.2 → V3.3 */
  function bumpVersion(v) {
    var m = /V(\d+)\.(\d+)/.exec(String(v || 'V0.0'));
    var major = parseInt(m && m[1], 10) || 0;
    var minor = parseInt(m && m[2], 10) || 0;
    return 'V' + major + '.' + (minor + 1);
  }

  function histId() {
    return 'h' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  /* 对比新旧配方，生成可读的变更摘要（写入历史记录） */
  function changeSummary(prev, next) {
    var out = [];
    if (prev.name !== next.name) { out.push('名称：' + (prev.name || '—') + ' → ' + (next.name || '—')); }
    if (prev.category !== next.category) { out.push('类目：' + (prev.category || '—') + ' → ' + (next.category || '—')); }
    if (prev.version !== next.version) { out.push('版本：' + (prev.version || '—') + ' → ' + (next.version || '—')); }
    var pc = prev.components || [], nc = next.components || [];
    var max = Math.max(pc.length, nc.length);
    for (var i = 0; i < max; i++) {
      var a = pc[i], b = nc[i];
      if (!a && b) { out.push('新增组分「' + (b.name || '') + '」用量 ' + num(b.qty) + (b.unit ? ' ' + b.unit : '')); continue; }
      if (a && !b) { out.push('删除组分「' + (a.name || '') + '」'); continue; }
      if (String(a.name || '') !== String(b.name || '')) { out.push('组分名称：' + (a.name || '—') + ' → ' + (b.name || '—')); }
      if (num(a.qty) !== num(b.qty)) {
        out.push('「' + (b.name || a.name || '') + '」用量：' + num(a.qty) + ' → ' + num(b.qty));
      }
      if (String(a.intCode || a.materialCode || '') !== String(b.intCode || b.materialCode || '')) {
        out.push('「' + (b.name || a.name || '') + '」内部编号已修改');
      }
      if (String(a.sysCode || '') !== String(b.sysCode || '')) {
        out.push('「' + (b.name || a.name || '') + '」系统料号已修改');
      }
    }
    if (String(prev.notes || '').trim() !== String(next.notes || '').trim()) { out.push('备注已修改'); }
    if (num(prev.gumQty) !== num(next.gumQty)) {
      out.push('原胶用量：' + num(prev.gumQty) + ' → ' + num(next.gumQty) + (next.gumUnit ? ' ' + next.gumUnit : ''));
    }
    if (!out.length) { out.push('内容微调'); }
    return out;
  }

  /* 向指定配方历史追加一条记录并写回 */
  function pushRecipeHistory(store, recipeId, entry) {
    var all = store.readCollection('recipes');
    var idx = all.findIndex(function (r) { return r && r.id === recipeId; });
    if (idx === -1) { return; }
    if (!Array.isArray(all[idx].history)) { all[idx].history = []; }
    all[idx].history.push(entry);
    all[idx].updatedAt = new Date().toISOString();
    store.writeCollection('recipes', all);
  }

  /* SECTION: 工厂 */
  function createService(store, options) {
    var opts = options || {};
    var today = opts.today || function () {
      var d = new Date();
      return d.getFullYear() + '-' + pad(d.getMonth() + 1, 2) + '-' + pad(d.getDate(), 2);
    };

    /* SECTION: 配方 · CRUD（REQ-003） */
    function listRecipes() {
      return store.readCollection('recipes');
    }

    function getRecipe(id) {
      return listRecipes().filter(function (r) { return r.id === id; })[0];
    }

    function nextRecipeId() {
      var meta = store.readMeta();
      var seq = (meta.nextSeq && meta.nextSeq.recipe) || (listRecipes().length + 1);
      var year = String(today()).slice(0, 4);
      var id = 'PF-' + year + '-' + pad(seq, 3);
      meta.nextSeq = Object.assign({}, meta.nextSeq, { recipe: seq + 1 });
      store.writeMeta(meta);
      return id;
    }

    function createRecipe(input, actor) {
      var check = validateRecipeForm(input);
      if (!check.ok) { return { ok: false, errors: check.errors }; }
      var nowIso = new Date().toISOString();
      var recipe = stripRemoved(Object.assign({}, input, {
        id: nextRecipeId(),
        status: 'draft',
        version: input.version || 'V0.1',
        components: JSON.parse(JSON.stringify(input.components || [])),
        createdBy: (actor && actor.username) || '未知',
        createdAt: nowIso,
        updatedAt: nowIso,
        history: [{
          id: histId(), type: 'created', at: nowIso, by: (actor && actor.username) || '未知',
          version: input.version || 'V0.1', note: '创建配方'
        }]
      }));
      var all = listRecipes();
      all.push(recipe);
      store.writeCollection('recipes', all);
      return { ok: true, recipe: recipe };
    }

    function updateRecipe(id, patch, actor) {
      var all = listRecipes();
      var idx = all.findIndex(function (r) { return r.id === id; });
      if (idx === -1) { return { ok: false, error: '配方不存在' }; }
      var prev = all[idx];
      var merged = stripRemoved(Object.assign({}, prev, patch));
      var check = validateRecipeForm(merged);
      if (!check.ok) { return { ok: false, errors: check.errors }; }
      merged.updatedAt = new Date().toISOString();
      merged.updatedBy = (actor && actor.username) || merged.updatedBy;
      /* 内容型修改（表单保存/复制）记录历史；纯状态流转由 setRecipeStatus 自行记录 */
      var contentPatch = patch.components !== undefined ||
        ['name', 'category', 'version', 'unit', 'notes', 'gumQty', 'gumUnit'].some(function (k) { return patch[k] !== undefined; });
      if (contentPatch && !Array.isArray(patch.history)) {
        if (!Array.isArray(merged.history)) { merged.history = []; }
        merged.history.push({
          id: histId(), type: 'update', at: merged.updatedAt,
          by: merged.updatedBy, version: merged.version,
          note: '编辑保存', changes: changeSummary(prev, merged)
        });
      }
      all[idx] = merged;
      store.writeCollection('recipes', all);
      return { ok: true, recipe: merged };
    }

    function setRecipeStatus(id, next, actor) {
      var recipe = getRecipe(id);
      if (!recipe) { return { ok: false, error: '配方不存在' }; }
      var allowed = RECIPE_FLOW[recipe.status] || [];
      if (allowed.indexOf(next) === -1) {
        return { ok: false, error: '状态不能从「' + recipe.status + '」流转到「' + next + '」' };
      }
      /* 审批通过需有审批权限的角色（管理员或只读审核） */
      if (next === 'active') {
        var role = (actor && actor.role) || 'admin';
        if (role !== 'admin' && role !== 'viewer') { return { ok: false, error: '没有审批权限' }; }
      }
      var nowIso = new Date().toISOString();
      var by = (actor && actor.username) || '未知';
      /* 审批通过：同一谱系内当前生效的旧版本自动停用 */
      if (next === 'active') {
        var rootId = recipe.rootId || recipe.id;
        var all = listRecipes();
        all = all.map(function (r) {
          if (r.id !== id && (r.id === rootId || r.rootId === rootId) && r.status === 'active') {
            r.status = 'obsolete';
            r.updatedAt = nowIso;
            if (!Array.isArray(r.history)) { r.history = []; }
            r.history.push({
              id: histId(), type: 'status', from: 'active', to: 'obsolete',
              at: nowIso, by: by, version: r.version,
              note: '被更新版本 ' + id + ' 审批通过后替代'
            });
          }
          return r;
        });
        store.writeCollection('recipes', all);
      }
      var hist = Array.isArray(recipe.history) ? recipe.history.slice() : [];
      hist.push({
        id: histId(), type: 'status', from: recipe.status, to: next,
        at: nowIso, by: by, version: recipe.version,
        note: next === 'active' ? '审批通过，配方生效'
          : next === 'draft' ? '审批退回，返回修改'
          : next === 'pending' ? '提交审批'
          : '停用'
      });
      return updateRecipe(id, { status: next, history: hist }, actor);
    }

    function deleteRecipe(id, actor, force) {
      var recipe = getRecipe(id);
      if (!recipe) { return { ok: false, error: '配方不存在' }; }
      var linked = listProduction().filter(function (p) { return p.recipeId === id; });
      if (linked.length > 0 && !force) {
        return { ok: false, needConfirm: true, linkedCount: linked.length,
          error: '该配方关联 ' + linked.length + ' 条配料记录' };
      }
      store.writeCollection('recipes', listRecipes().filter(function (r) { return r.id !== id; }));
      return { ok: true, linkedRemoved: linked.length };
    }

    function duplicateRecipe(id, actor) {
      var source = getRecipe(id);
      if (!source) { return { ok: false, error: '配方不存在' }; }
      var copyData = Object.assign({}, source);
      delete copyData.id;
      delete copyData.status;
      delete copyData.createdBy;
      delete copyData.createdAt;
      delete copyData.updatedAt;
      var created = createRecipe(copyData, actor);
      if (created.ok) {
        /* 复制时递增版本号，名称加副本标记 */
        var major = parseInt((source.version || 'V0').replace(/[^0-9.]/g, '').split('.')[0], 10) || 0;
        created = updateRecipe(created.recipe.id, {
          name: source.name + '（副本）',
          version: 'V' + (major + 1) + '.0'
        }, actor);
      }
      return created;
    }

    /* 生效配方的「更新配方」：创建新版本草稿并进入审批流程 */
    function createRecipeUpdate(id, actor) {
      var source = getRecipe(id);
      if (!source) { return { ok: false, error: '配方不存在' }; }
      if (source.status !== 'active') { return { ok: false, error: '仅生效配方可发起更新' }; }
      var nowIso = new Date().toISOString();
      var by = (actor && actor.username) || '未知';
      var copy = JSON.parse(JSON.stringify(source));
      delete copy.id;
      copy.id = nextRecipeId();
      copy.status = 'draft';
      copy.version = bumpVersion(source.version);
      copy.rootId = source.rootId || source.id;
      copy.updateFrom = source.id;
      copy.createdBy = by;
      copy.createdAt = nowIso;
      copy.updatedBy = by;
      copy.updatedAt = nowIso;
      copy.history = [{
        id: histId(), type: 'update', at: nowIso, by: by, version: copy.version,
        note: '基于 ' + source.id + '（' + source.version + '）发起更新，生成新版本待审批',
        changes: ['基于 ' + source.id + '（' + source.version + '）创建更新版本 ' + copy.version]
      }];
      var all = listRecipes();
      all.push(copy);
      store.writeCollection('recipes', all);
      pushRecipeHistory(store, source.id, {
        id: histId(), type: 'update', at: nowIso, by: by, version: source.version,
        note: '发起更新版本 ' + copy.id + '（' + copy.version + '），待审批通过后生效', changes: []
      });
      return { ok: true, recipe: copy };
    }

    /* SECTION: 生产记录（REQ-005） */
    function listProduction() {
      return store.readCollection('production');
    }

    function getProduction(id) {
      return listProduction().filter(function (p) { return p.id === id; })[0];
    }

    function productionYield(record) {
      var input = num(record && record.inputQty);
      return input > 0 ? num(record.outputQty) / input * 100 : 0;
    }

    function productionPassRate(record) {
      var output = num(record && record.outputQty);
      return output > 0 ? num(record.qualifiedQty) / output * 100 : 0;
    }

    function nextBatchNo(dateStr, linePrefix) {
      var compact = String(dateStr).replace(/-/g, '');
      var prefix = 'B' + compact + '-' + (linePrefix || 'X');
      var max = 0;
      listProduction().forEach(function (p) {
        var m = new RegExp('^' + prefix + '(\\d+)$').exec(p.batchNo || '');
        if (m) { max = Math.max(max, parseInt(m[1], 10)); }
      });
      return prefix + (max + 1);
    }

    function nextProductionId() {
      var meta = store.readMeta();
      var seq = (meta.nextSeq && meta.nextSeq.production) || (listProduction().length + 1);
      var year = String(today()).slice(0, 4);
      var id = 'PR-' + year + '-' + pad(seq, 4);
      meta.nextSeq = Object.assign({}, meta.nextSeq, { production: seq + 1 });
      store.writeMeta(meta);
      return id;
    }

    /* SECTION: 逐原料用量与调色（REQ-013/014）
     * 配方量以百分比展示；配料用量按「目标原胶量 ÷ 配方原胶量」比例折算，
     * 未填目标原胶量（或配方无原胶）时按 1:1。
     */
    function usagePlan(recipeId, targetGum) {
      var recipe = getRecipe(recipeId);
      if (!recipe) { return []; }
      var comps = recipe.components || [];
      var gum = num(recipe.gumQty);
      var tg = num(targetGum);
      var total = comps.reduce(function (s, c) { return s + num(c.qty); }, 0) + gum;
      var scale = (gum > 0 && tg > 0) ? tg / gum : 1;
      var out = [];
      /* 原胶置顶：作为独立的折算锚点行 */
      if (gum > 0) {
        out.push({
          name: recipe.gumName || '原胶', intCode: recipe.gumIntCode || '', sysCode: recipe.gumSysCode || '',
          materialCode: '', materialId: recipe.gumMaterialId || '',
          unit: recipe.gumUnit || recipe.unit || 'kg',
          planQty: gum,
          planPct: total > 0 ? gum / total * 100 : 0,
          calcQty: tg > 0 ? tg : gum,
          actualQty: '', isGum: true
        });
      }
      comps.forEach(function (c) {
        var q = num(c.qty);
        out.push({
          name: c.name || '',
          intCode: c.intCode || c.materialCode || '',
          sysCode: c.sysCode || '',
          materialCode: c.materialCode || '',
          materialId: c.materialId || '',
          unit: c.unit || recipe.unit || '',
          planQty: q,
          planPct: total > 0 ? q / total * 100 : 0,
          calcQty: Math.round(scale * q * 100) / 100,
          actualQty: ''
        });
      });
      return out;
    }

    /* 以配方 + 目标原胶量重建用量清单，保留已填写的实际用量 */
    function buildUsage(recipe, targetGum, provided) {
      var base = usagePlan(recipe.id, targetGum);
      return base.map(function (row, i) {
        /* 实际用量匹配：原胶行优先按 isGum 匹配（物料名称可自定义），其余按名称，回退按索引 */
        var p = null;
        if (Array.isArray(provided)) {
          if (row.isGum) {
            for (var j = 0; j < provided.length; j++) {
              if (provided[j] && provided[j].isGum) { p = provided[j]; break; }
            }
          }
          if (!p) {
            for (var k = 0; k < provided.length; k++) {
              if (provided[k] && provided[k].name === row.name) { p = provided[k]; break; }
            }
          }
          if (!p) { p = provided[i]; }
        }
        var actual = (p && p.actualQty !== undefined && p.actualQty !== null)
          ? p.actualQty : row.actualQty;
        return Object.assign({}, row, { actualQty: actual });
      });
    }

    function usageTotal(usage) {
      return (usage || []).reduce(function (sum, u) {
        return sum + num(u && u.actualQty);
      }, 0);
    }

    function colorAdjustTotal(adjust) {
      return ((adjust && adjust.items) || []).reduce(function (sum, it) {
        return sum + num(it && it.qty);
      }, 0);
    }

    function normalizeAdjust(adjust) {
      var items = adjust && Array.isArray(adjust.items) ? adjust.items : [];
      return {
        items: items.map(function (it) {
          return {
            material: String((it && it.material) || '').trim(),
            intCode: String((it && it.intCode) || ''),
            qty: num(it && it.qty),
            reason: String((it && it.reason) || '')
          };
        }),
        note: String((adjust && adjust.note) || '')
      };
    }

    function createProduction(input, actor) {
      var recipe = getRecipe(input.recipeId);
      if (!recipe) { return { ok: false, error: '配方不存在或已删除' }; }
      var planDate = input.planDate || today();
      var merged = Object.assign({}, input, {
        recipeName: recipe.name,
        status: input.status || 'planned',
        outputQty: num(input.outputQty),
        qualifiedQty: num(input.qualifiedQty),
        inputQty: num(input.inputQty),
        targetGum: num(input.targetGum),
        materialUsage: buildUsage(recipe, input.targetGum, input.materialUsage),
        colorAdjust: normalizeAdjust(input.colorAdjust)
      });
      var check = validateProductionForm(merged);
      if (!check.ok) { return { ok: false, errors: check.errors }; }
      merged.id = nextProductionId();
      merged.batchNo = nextBatchNo(planDate, recipe.linePrefix);
      merged.createdBy = (actor && actor.username) || '未知';
      merged.createdAt = new Date().toISOString();
      var all = listProduction();
      all.push(merged);
      store.writeCollection('production', all);
      recordRecipeUsage(input.recipeId, merged, actor);
      return { ok: true, record: merged };
    }

    function updateProduction(id, patch, actor) {
      var current = getProduction(id);
      if (!current) { return { ok: false, error: '配料记录不存在' }; }
      var merged = Object.assign({}, current, patch);
      var check = validateProductionForm(merged);
      if (!check.ok) { return { ok: false, errors: check.errors }; }
      merged.updatedAt = new Date().toISOString();
      merged.updatedBy = (actor && actor.username) || current.updatedBy;
      var recipe = getRecipe(current.recipeId);
      if (recipe) { merged.materialUsage = buildUsage(recipe, merged.targetGum, merged.materialUsage); }
      var all = listProduction().map(function (p) { return p.id === id ? merged : p; });
      store.writeCollection('production', all);
      recordRecipeUsage(current.recipeId, merged, actor);
      return { ok: true, record: merged };
    }

    /* 把生产记录的实际物料用量写入配方「历史变更和使用」 */
    function recordRecipeUsage(recipeId, record, actor) {
      if (!recipeId || !record) { return; }
      var usage = Array.isArray(record.materialUsage) ? record.materialUsage : [];
      if (!usage.length) { return; }
      var all = listRecipes();
      var idx = all.findIndex(function (r) { return r && r.id === recipeId; });
      if (idx === -1) { return; }
      var recipe = all[idx];
      if (!Array.isArray(recipe.history)) { recipe.history = []; }
      var entry = {
        id: histId(), type: 'usage',
        at: new Date().toISOString(),
        by: (actor && actor.username) || record.operator || '未知',
        batchNo: record.batchNo,
        mixDate: record.planDate,
        line: record.line,
        operator: record.operator,
        usage: usage.map(function (u) {
          return {
            name: u.name || '', intCode: u.intCode || u.materialCode || '',
            sysCode: u.sysCode || '', unit: u.unit || '',
            planQty: num(u.planQty),
            planPct: (u.planPct === '' || u.planPct == null) ? null : num(u.planPct),
            calcQty: (u.calcQty === '' || u.calcQty == null) ? null : num(u.calcQty),
            actualQty: (u.actualQty === '' || u.actualQty == null) ? null : num(u.actualQty)
          };
        })
      };
      var found = recipe.history.some(function (e, i) {
        if (e.type === 'usage' && e.batchNo === record.batchNo) {
          recipe.history[i] = entry; return true;
        }
        return false;
      });
      if (!found) { recipe.history.push(entry); }
      all[idx] = recipe;
      store.writeCollection('recipes', all);
    }

    function setProductionStatus(id, next, patch) {
      var record = getProduction(id);
      if (!record) { return { ok: false, error: '配料记录不存在' }; }
      var allowed = PRODUCTION_FLOW[record.status] || [];
      if (allowed.indexOf(next) === -1) {
        return { ok: false, error: '状态不能从「' + record.status + '」推进到「' + next + '」' };
      }
      var merged = Object.assign({}, record, patch || {}, { status: next });
      if (next === 'completed' && (!merged.qcResult || merged.qcResult === 'pending')) {
        return { ok: false, error: '完成批次前请填写质检结论' };
      }
      var check = validateProductionForm(merged);
      if (!check.ok) { return { ok: false, errors: check.errors }; }
      var all = listProduction().map(function (p) { return p.id === id ? merged : p; });
      store.writeCollection('production', all);
      return { ok: true, record: merged };
    }

    function deleteProduction(id) {
      var found = getProduction(id);
      if (!found) { return { ok: false, error: '配料记录不存在' }; }
      store.writeCollection('production', listProduction().filter(function (p) { return p.id !== id; }));
      return { ok: true };
    }

    /* SECTION: 列表查询（REQ-007） */
    function paginate(items, params) {
      var page = Math.max(1, num(params.page) || 1);
      var size = num(params.pageSize) || items.length || 1;
      var pages = Math.max(1, Math.ceil(items.length / size));
      page = Math.min(page, pages);
      return {
        items: items.slice((page - 1) * size, page * size),
        total: items.length, page: page, pages: pages
      };
    }

    function sortBy(list, key, dir) {
      var sign = dir === 'asc' ? 1 : -1;
      return list.slice().sort(function (a, b) {
        var av = a[key] == null ? '' : a[key];
        var bv = b[key] == null ? '' : b[key];
        if (av < bv) { return -1 * sign; }
        if (av > bv) { return 1 * sign; }
        return 0;
      });
    }

    function queryRecipes(params) {
      params = params || {};
      var list = listRecipes();
      if (params.search) {
        var kw = String(params.search).toLowerCase();
        list = list.filter(function (r) {
          return [r.id, r.name, r.category, r.version].join(' ').toLowerCase().indexOf(kw) !== -1;
        });
      }
      if (params.status) {
        list = list.filter(function (r) { return r.status === params.status; });
      }
      if (params.category) {
        list = list.filter(function (r) { return r.category === params.category; });
      }
      list = sortBy(list, params.sort || 'updatedAt', params.dir || 'desc');
      return paginate(list, params);
    }

    function queryProduction(params) {
      params = params || {};
      var list = listProduction();
      if (params.search) {
        var kw = String(params.search).toLowerCase();
        list = list.filter(function (p) {
          return [p.batchNo, p.recipeName, p.line, p.operator].join(' ').toLowerCase().indexOf(kw) !== -1;
        });
      }
      if (params.status) {
        list = list.filter(function (p) { return p.status === params.status; });
      }
      if (params.qcResult) {
        list = list.filter(function (p) { return p.qcResult === params.qcResult; });
      }
      if (params.recipeId) {
        list = list.filter(function (p) { return p.recipeId === params.recipeId; });
      }
      if (params.from) {
        list = list.filter(function (p) { return p.planDate >= params.from; });
      }
      if (params.to) {
        list = list.filter(function (p) { return p.planDate <= params.to; });
      }
      list = sortBy(list, params.sort || 'planDate', params.dir || 'desc');
      return paginate(list, params);
    }

    function recipeCategories() {
      var seen = {};
      listRecipes().forEach(function (r) { seen[r.category] = true; });
      return Object.keys(seen);
    }

    /* SECTION: 看板聚合（REQ-006） */
    function rangeBounds(range) {
      var t = today();
      if (range === 'month') { return { from: t.slice(0, 8) + '01', to: '9999-12-31' }; }
      if (range === 'week') {
        var d = new Date(t + 'T00:00:00');
        d.setDate(d.getDate() - 6);
        var from = d.getFullYear() + '-' + pad(d.getMonth() + 1, 2) + '-' + pad(d.getDate(), 2);
        return { from: from, to: '9999-12-31' };
      }
      return { from: '0000-01-01', to: '9999-12-31' };
    }

    function dashboard(params) {
      params = params || {};
      var bounds = rangeBounds(params.range || 'all');
      var allProduction = listProduction();
      var records = allProduction.filter(function (p) {
        return p.planDate >= bounds.from && p.planDate <= bounds.to;
      });
      var recipes = listRecipes();
      var completed = records.filter(function (p) { return p.status === 'completed'; });
      var totalOutput = completed.reduce(function (s, p) { return s + num(p.outputQty); }, 0);
      var totalQualified = completed.reduce(function (s, p) { return s + num(p.qualifiedQty); }, 0);
      var inProgress = allProduction.filter(function (p) {
        return p.status === 'in_progress' || p.status === 'qc_check';
      }).length;
      var adjusted = records.filter(function (p) {
        var adj = p.colorAdjust;
        return adj && ((Array.isArray(adj.items) && adj.items.length > 0) || String(adj.note || '').trim());
      }).length;

      var kpi = {
        recipeTotal: recipes.length,
        recipeActive: recipes.filter(function (r) { return r.status === 'active'; }).length,
        batchTotal: records.length,
        batchCompleted: completed.length,
        passRate: totalOutput > 0 ? totalQualified / totalOutput * 100 : 0,
        totalOutput: totalOutput,
        inProgress: inProgress,
        adjustedBatches: adjusted
      };

      var byDate = {};
      records.forEach(function (p) {
        if (!byDate[p.planDate]) { byDate[p.planDate] = { date: p.planDate, output: 0, qualified: 0, batches: 0 }; }
        byDate[p.planDate].output += num(p.outputQty);
        byDate[p.planDate].qualified += num(p.qualifiedQty);
        byDate[p.planDate].batches += 1;
      });
      var trend = Object.keys(byDate).sort().map(function (k) { return byDate[k]; });

      var byRecipe = {};
      records.forEach(function (p) {
        var key = p.recipeId;
        if (!byRecipe[key]) { byRecipe[key] = { id: key, name: p.recipeName, output: 0, batches: 0 }; }
        byRecipe[key].output += num(p.outputQty);
        byRecipe[key].batches += 1;
      });
      var ranking = Object.keys(byRecipe).map(function (k) { return byRecipe[k]; })
        .sort(function (a, b) { return b.output - a.output; });

      var statusDist = { planned: 0, in_progress: 0, qc_check: 0, completed: 0 };
      records.forEach(function (p) { statusDist[p.status] = (statusDist[p.status] || 0) + 1; });

      var categoryDist = {};
      records.forEach(function (p) {
        var recipe = recipes.filter(function (r) { return r.id === p.recipeId; })[0];
        var cat = recipe ? recipe.category : '未归类';
        categoryDist[cat] = (categoryDist[cat] || 0) + num(p.outputQty);
      });

      var recent = sortBy(records, 'planDate', 'desc').slice(0, 6);

      return { kpi: kpi, trend: trend, ranking: ranking, statusDist: statusDist,
        categoryDist: categoryDist, recent: recent };
    }

    /* SECTION: 表单校验（REQ-009） */
    function validateRecipeForm(form) {
      var errors = {};
      if (!form || !String(form.name || '').trim()) { errors.name = '请填写配方名称'; }
      if (!String(form.category || '').trim()) { errors.category = '请选择或填写类目'; }
      if (num(form.gumQty) < 0) { errors.gumQty = '原胶用量不能为负'; }
      var comps = form && form.components;
      if (!Array.isArray(comps) || comps.length === 0) {
        errors.components = '至少添加一个组分';
      } else {
        comps.forEach(function (c, i) {
          var rowErrors = [];
          if (!c || !String(c.name || '').trim()) { rowErrors.push('名称必填'); }
          if (!(num(c && c.qty) > 0)) { rowErrors.push('用量需大于 0'); }
          if (rowErrors.length) { errors['components.' + i] = rowErrors.join('；'); }
        });
      }
      return { ok: Object.keys(errors).length === 0, errors: errors };
    }

    function validateProductionForm(form) {
      var errors = {};
      if (!form || !String(form.recipeId || '').trim()) { errors.recipeId = '请选择配方'; }
      if (!String(form.line || '').trim()) { errors.line = '请填写产线'; }
      if (!String(form.operator || '').trim()) { errors.operator = '请填写操作员'; }
      if (num(form.targetGum) < 0) { errors.targetGum = '目标原胶量不能为负'; }
      if (num(form.inputQty) < 0) { errors.inputQty = '投料量不能为负'; }
      var output = num(form.outputQty);
      var qualified = num(form.qualifiedQty);
      if (output < 0) { errors.outputQty = '产出量不能为负'; }
      if (qualified < 0) { errors.qualifiedQty = '合格量不能为负'; }
      if (output >= 0 && qualified > output) { errors.qualifiedQty = '合格量不能大于产出量'; }
      /* 逐原料实际用量 */
      if (Array.isArray(form.materialUsage)) {
        form.materialUsage.forEach(function (u, i) {
          var v = u && u.actualQty;
          if (v !== '' && v != null && num(v) < 0) {

      }

      var adjItems = (form.colorAdjust && form.colorAdjust.items) || [];
      adjItems.forEach(function (it, i) {
        var rowErr = [];
        if (!it || !String(it.material || '').trim()) { rowErr.push('调色物料必填'); }
        if (num(it && it.qty) < 0) { rowErr.push('补加量不能为负'); }
        if (rowErr.length) { errors['colorAdjust.' + i] = '调色第' + (i + 1) + '项：' + rowErr.join('；'); }
      });
      return { ok: Object.keys(errors).length === 0, errors: errors };
    }

    /* SECTION: 数据迁移
     * 兼容旧版本本地数据：删除已移除字段（单价/损耗/目标批量/开始结束时间），
     * 补齐组分内部编号与系统料号，并为缺失的配方生成历史记录、回填使用记录。

    function migrateData() {
      var recipes = listRecipes();
      var prods = listProduction();
      var changed = false;

      recipes.forEach(function (r) {
        var touch = false;
        if (r.targetBatchSize != null) { delete r.targetBatchSize; touch = true; }
        (r.components || []).forEach(function (c) {
          if (c.unitPrice != null) { delete c.unitPrice; touch = true; }
          if (c.lossRate != null) { delete c.lossRate; touch = true; }
          if (!c.intCode && c.materialCode) { c.intCode = c.materialCode; touch = true; }
          if (c.sysCode == null) { c.sysCode = ''; touch = true; }
        });
        if (!Array.isArray(r.history)) {
          r.history = [];
          touch = true;
        }
        if (r.history.length === 0) {
          r.history.push({
            id: histId(), type: 'created', at: r.createdAt, by: r.createdBy,
            version: r.version, note: '创建配方'
          });
          if (r.updatedAt && r.updatedAt !== r.createdAt) {
            r.history.push({
              id: histId(), type: 'update', at: r.updatedAt, by: r.updatedBy || r.createdBy,
              version: r.version, note: '历史数据迁移：最近一次更新', changes: []
            });
          }
          touch = true;
        }
        if (touch) { changed = true; }
      });

      prods.forEach(function (p) {
        var touch = false;
        if (p.startDate != null) { delete p.startDate; touch = true; }
        if (p.endDate != null) { delete p.endDate; touch = true; }
        if (touch) { changed = true; }
      });

      prods.forEach(function (p) {
        if (!Array.isArray(p.materialUsage) || !p.materialUsage.length) { return; }
        var idx = recipes.findIndex(function (r) { return r && r.id === p.recipeId; });
        if (idx === -1) { return; }
        var rebuilt = buildUsage(recipes[idx], p.targetGum, p.materialUsage);
        if (JSON.stringify(rebuilt) !== JSON.stringify(p.materialUsage)) {
          p.materialUsage = rebuilt;
          changed = true;
        }
      });

      /* 为已有生产记录回填配方使用记录（按批次幂等） */
      prods.forEach(function (p) {
        if (!Array.isArray(p.materialUsage) || !p.materialUsage.length) { return; }
        var idx = recipes.findIndex(function (r) { return r && r.id === p.recipeId; });
        if (idx === -1) { return; }
        var hist = recipes[idx].history;
        if (hist.some(function (e) { return e.type === 'usage' && e.batchNo === p.batchNo; })) { return; }
        hist.push({
          id: histId(), type: 'usage',
          at: p.updatedAt || p.createdAt || new Date().toISOString(),
          by: p.updatedBy || p.createdBy || p.operator || '未知',
          batchNo: p.batchNo, mixDate: p.planDate, line: p.line, operator: p.operator,
          usage: p.materialUsage.map(function (u) {
            return {
              name: u.name || '', intCode: u.intCode || u.materialCode || '',
              sysCode: u.sysCode || '', unit: u.unit || '',
              planQty: num(u.planQty),
              planPct: (u.planPct === '' || u.planPct == null) ? null : num(u.planPct),
              calcQty: (u.calcQty === '' || u.calcQty == null) ? null : num(u.calcQty),
              actualQty: (u.actualQty === '' || u.actualQty == null) ? null : num(u.actualQty)
            };
          })
        });
        changed = true;
      });

      if (changed) {
        store.writeCollection('recipes', recipes);
        store.writeCollection('production', prods);
      }
    }

    return {
      listRecipes: listRecipes,
      getRecipe: getRecipe,
      createRecipe: createRecipe,
      updateRecipe: updateRecipe,
      setRecipeStatus: setRecipeStatus,
      deleteRecipe: deleteRecipe,
      duplicateRecipe: duplicateRecipe,
      createRecipeUpdate: createRecipeUpdate,
      migrateData: migrateData,
      listProduction: listProduction,
      getProduction: getProduction,
      createProduction: createProduction,
      updateProduction: updateProduction,
      setProductionStatus: setProductionStatus,
      deleteProduction: deleteProduction,
      productionYield: productionYield,
      productionPassRate: productionPassRate,
      usagePlan: usagePlan,
      buildUsage: buildUsage,
      usageTotal: usageTotal,
      colorAdjustTotal: colorAdjustTotal,
      queryRecipes: queryRecipes,
      queryProduction: queryProduction,
      recipeCategories: recipeCategories,
      dashboard: dashboard,
      validateRecipeForm: validateRecipeForm,
      validateProductionForm: validateProductionForm
    };
  }

  return { createService: createService };
});

<script>
/* SECTION: materials
 * 原材料数据库：以 Excel「原材料」工作表提取的系统料号/内部编号为种子，
 * 支持检索（名称/系统料号/内部编号）与新增、编辑、删除，数据保存在浏览器本地。
 * 浏览器通过 RPM.materials 暴露，Node 测试通过 module.exports 引入。
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) {
    module.exports = factory(require('./materials-data.js'));
  } else {
    root.RPM = root.RPM || {};
    root.RPM.materials = factory(root.RPM.materialsData);
  }
})(typeof globalThis !== 'undefined' ? globalThis : this, function (excelSeed) {
  'use strict';

  var PAGE_MAX = 20;

  function copySeed() {
    return JSON.parse(JSON.stringify(excelSeed));
  }

  function norm(v) {
    var s = v == null ? '' : String(v).trim();
    return s || null;
  }

  function nextId(list) {
    var max = 0;
    list.forEach(function (m) {
      var mm = /^M(\d{4,})$/.exec(m.id || '');
      if (mm) { max = Math.max(max, parseInt(mm[1], 10)); }
    });
    var s = String(max + 1);
    while (s.length < 4) { s = '0' + s; }
    return 'M' + s;
  }

  /* SECTION: 工厂 */
  function createMaterials(store) {
    /* 首次（或升级后）把 Excel 提取结果种入本地存储；之后以本地数据为准。
     * 判定依据是原料键本身是否存在，避免旧备份导入时误清除手工条目。 */
    function ensureSeeded() {
      if (store.hasCollection('materials')) { return; }
      store.writeCollection('materials', copySeed());
    }
    ensureSeeded();

    function list() {
      ensureSeeded();
      return store.readCollection('materials');
    }

    function get(id) {
      return list().filter(function (m) { return m.id === id; })[0];
    }

    function findByIntCode(code) {
      var key = norm(code);
      if (!key) { return undefined; }
      var lower = key.toLowerCase();
      return list().filter(function (m) {
        return m.intCode && String(m.intCode).toLowerCase() === lower;
      })[0];
    }

    /* SECTION: 检索：名称/全称/系统料号/内部编号，任一字段子串命中 */
    function search(keyword) {
      ensureSeeded();
      var all = store.readCollection('materials');
      var kw = String(keyword == null ? '' : keyword).trim().toLowerCase();
      if (!kw) { return all.slice(0, PAGE_MAX); }
      var hits = [];
      for (var i = 0; i < all.length && hits.length < PAGE_MAX; i++) {
        var m = all[i];
        var hay = [m.name, m.fullName, m.sysCode, m.intCode]
          .map(function (v) { return v == null ? '' : String(v).toLowerCase(); })
          .join(' ');
        if (hay.indexOf(kw) !== -1) { hits.push(m); }
      }
      return hits;
    }

    function query(params) {
      params = params || {};
      var kw = String(params.search || '').trim().toLowerCase();
      var all = list().filter(function (m) {
        if (!kw) { return true; }
        return [m.name, m.fullName, m.sysCode, m.intCode]
          .map(function (v) { return v == null ? '' : String(v).toLowerCase(); })
          .join(' ').indexOf(kw) !== -1;
      });
      var page = Math.max(1, Number(params.page) || 1);
      var size = Number(params.pageSize) || 15;
      var pages = Math.max(1, Math.ceil(all.length / size));
      page = Math.min(page, pages);
      return { items: all.slice((page - 1) * size, page * size),
        total: all.length, page: page, pages: pages };
    }

    /* SECTION: 增改删 */
    function validate(input, excludeId) {
      var errors = {};
      var name = norm(input.name);
      var intCode = norm(input.intCode);
      var sysCode = norm(input.sysCode);
      if (!name && !intCode) { errors.name = '名称与内部编号至少填写一项'; }
      if (intCode && sysCode) {
        var dup = list().some(function (m) {
          return m.id !== excludeId && norm(m.intCode) === intCode;
        });
        if (dup) { return { dupInt: true, errors: {} }; }
      } else if (intCode) {
        var dup2 = list().some(function (m) {
          return m.id !== excludeId && norm(m.intCode) === intCode;
        });
        if (dup2) { return { dupInt: true, errors: {} }; }
      }
      if (sysCode) {
        var dupS = list().some(function (m) {
          return m.id !== excludeId && norm(m.sysCode) === sysCode && norm(m.intCode) === intCode;
        });
        if (dupS) { return { dupSys: true, errors: {} }; }
      }
      var price = input.unitPrice;
      if (price != null && String(price).trim() !== '') {
        var n = Number(price);
        if (!Number.isFinite(n) || n < 0) { errors.unitPrice = '参考单价需为非负数字'; }
      }
      return { errors: errors };
    }

    function create(input) {
      var v = validate(input, null);
      if (v.dupInt) { return { ok: false, error: '内部编号已存在' }; }
      if (v.dupSys) { return { ok: false, error: '系统料号与内部编号组合已存在' }; }
      if (Object.keys(v.errors).length) { return { ok: false, errors: v.errors }; }
      var all = list();
      var name = norm(input.name);
      var mat = {
        id: nextId(all),
        name: name || norm(input.intCode),
        fullName: norm(input.fullName) || name || norm(input.intCode),
        sysCode: norm(input.sysCode),
        intCode: norm(input.intCode),
        unit: norm(input.unit) || 'kg',
        unitPrice: input.unitPrice == null || String(input.unitPrice).trim() === '' ? null : Number(input.unitPrice),
        source: 'manual',
        createdAt: new Date().toISOString()
      };
      all.push(mat);
      store.writeCollection('materials', all);
      return { ok: true, material: mat };
    }

    function update(id, patch) {
      var all = list();
      var idx = all.findIndex(function (m) { return m.id === id; });
      if (idx === -1) { return { ok: false, error: '原料不存在' }; }
      var merged = Object.assign({}, all[idx], patch);
      var v = validate(merged, id);
      if (v.dupInt) { return { ok: false, error: '内部编号已存在' }; }
      if (v.dupSys) { return { ok: false, error: '系统料号与内部编号组合已存在' }; }
      if (Object.keys(v.errors).length) { return { ok: false, errors: v.errors }; }
      if (merged.unitPrice != null && String(merged.unitPrice).trim() !== '') {
        merged.unitPrice = Number(merged.unitPrice);
      } else {
        merged.unitPrice = null;
      }
      all[idx] = merged;
      store.writeCollection('materials', all);
      return { ok: true, material: merged };
    }

    function remove(id) {
      var all = list();
      if (!all.some(function (m) { return m.id === id; })) { return { ok: false, error: '原料不存在' }; }
      store.writeCollection('materials', all.filter(function (m) { return m.id !== id; }));
      return { ok: true };
    }

    /* 恢复为 Excel 提取的初始清单（清除手工条目与修改） */
    function reseedFromExcel() {
      store.writeCollection('materials', copySeed());
      store.setMeta('materialsSeeded', true);
    }

    return {
      list: list,
      get: get,
      search: search,
      query: query,
      findByIntCode: findByIntCode,
      create: create,
      update: update,
      remove: remove,
      reseedFromExcel: reseedFromExcel,
      seedCount: excelSeed.length
    };
  }

  return { createMaterials: createMaterials };
});

</script>
<script>
/* SECTION: app — 界面层
 * 视图渲染与事件绑定。业务逻辑一律来自 service/auth/storage，本文件只做：
 *   state 管理 → render 纯渲染 → bind 事件委托 → 变更后 re-render
 * 约定：所有拼入 innerHTML 的动态文本必须经 h.esc()。
 */
(function (root) {
  'use strict';
  var RPM = root.RPM;
  var h = RPM.h, service = RPM.service, authMod = RPM.auth, storageMod = RPM.storage,
      materialsMod = RPM.materials;

  /* SECTION: state */
  var state = {
    store: null, auth: null, svc: null, session: null,
    view: 'dashboard',
    recipeQuery: { search: '', status: '', category: '', sort: 'updatedAt', dir: 'desc', page: 1, pageSize: 8 },
    prodQuery: { search: '', status: '', qcResult: '', recipeId: '', from: '', to: '', sort: 'planDate', dir: 'desc', page: 1, pageSize: 8 },
    matQuery: { search: '', page: 1, pageSize: 15 },
    picker: null,        /* 原料检索弹窗 {row, keyword, hits} */
    dashRange: 'all',
    detail: null,        /* 详情弹窗 {type:'recipe'|'production', id, tab} */
    form: null,          /* 当前打开的表单 {type:'recipe'|'production', id?, data, errors} */
    matForm: null,       /* 原料表单独立状态，不与配方表单互踩 */
    confirm: null,       /* 当前确认弹窗 {title, body, danger, onOk} */
    flash: null          /* 顶部提示 {kind:'ok'|'err', text} */
  };

  var el = { app: null, nav: null, view: null, modal: null, flash: null };

  /* SECTION: 启动 */
  function boot() {
    el.app = document.getElementById('app');
    el.nav = document.getElementById('topnav');
    el.view = document.getElementById('view');
    el.modal = document.getElementById('modal-root');
    el.flash = document.getElementById('flash');

    state.store = storageMod.createStorage(window.localStorage);
    state.auth = authMod.createAuth(state.store);
    state.svc = service.createService(state.store);
    state.svc.migrateData();
    state.mats = materialsMod.createMaterials(state.store);
    state.session = state.auth.currentSession();

    bindGlobalEvents();
    render();
  }

  /* SECTION: 视图路由表（含权限） */
  var VIEWS = [
    { id: 'dashboard', label: '数据看板', perm: 'dashboard.view' },
    { id: 'recipes', label: '配方管理', perm: 'recipe.view' },
    { id: 'production', label: '配料记录', perm: 'production.view' },
    { id: 'materials', label: '原材料库', perm: 'material.view' },
    { id: 'users', label: '账号管理', perm: 'user.manage' },
    { id: 'data', label: '数据管理', perm: 'data.export' }
  ];

  /* SECTION: 渲染入口 */
  function render() {
    if (!state.session) { renderLogin(); return; }
    renderNav();
    var fn = { dashboard: renderDashboard, recipes: renderRecipes, production: renderProduction,
      materials: renderMaterials, users: renderUsers, data: renderData }[state.view] || renderDashboard;
    el.view.innerHTML = fn();
    renderModal();
    renderFlash();
  }

  /* SECTION: 顶栏与导航 */
  function renderNav() {
    var s = state.session;
    var tabs = VIEWS.filter(function (v) { return state.auth.can(s, v.perm); }).map(function (v) {
      return '<button class="tab' + (state.view === v.id ? ' active' : '') +
        '" data-nav="' + v.id + '">' + v.label + '</button>';
    }).join('');
    el.nav.style.display = '';
    el.nav.querySelector('.brand').innerHTML =
      '<span class="brand-mark">配</span><span class="brand-text">配方管理与配料记录</span>';
    el.nav.querySelector('.tabs').innerHTML = tabs;
    el.nav.querySelector('.userbox').innerHTML =
      '<span class="avatar">' + h.esc(h.initialOf(s.displayName)) + '</span>' +
      '<span class="user-meta"><b>' + h.esc(s.displayName) + '</b>' +
      '<em>' + h.esc(state.auth.roleLabel(s.role)) + '</em></span>' +
      '<button class="btn ghost sm" data-action="logout">退出</button>';
  }

  /* SECTION: 登录视图（REQ-001/002） */
  function renderLogin() {
    el.nav.style.display = 'none';
    el.modal.innerHTML = '';
    el.view.innerHTML =
      '<div class="login-wrap">' +
      '  <div class="login-card">' +
      '    <div class="login-head"><span class="brand-mark big">配</span>' +
      '      <h1>配方管理与配料记录</h1><p>工艺配方台账 · 批次生产追溯</p></div>' +
      '    <form data-form="login">' +
          field('username', '账号', '<input name="username" autocomplete="username" placeholder="如 admin" required>') +
          field('password', '口令', '<input name="password" type="password" autocomplete="current-password" placeholder="登录口令" required>') +
          '<div class="err-slot" id="login-err"></div>' +
          '<button class="btn primary block" type="submit" data-primary-action="login">进入系统</button>' +
          '</form>' +
      '    <div class="demo-accounts"><h3>演示账号</h3><ul>' +
          ['admin / admin123 · 管理员', 'lixiaotong / eng12345 · 工艺员',
            'wangqiang / op123456 · 生产录入', 'auditor / view1234 · 只读审核']
            .map(function (t) { return '<li>' + t + '</li>'; }).join('') +
      '    </ul><p class="tip">账号校验与数据均保存在当前浏览器本地。</p></div>' +
      '  </div></div>';
  }

  function field(name, label, inner) {
    return '<label class="field"><span>' + label + '</span>' + inner +
      '<em class="field-err" data-err-for="' + name + '"></em></label>';
  }

  function roleSelect(name, value) {
    return '<select name="' + name + '">' + state.auth.ROLES.map(function (r) {
      return '<option value="' + r + '"' + (r === value ? ' selected' : '') + '>' +
        h.esc(state.auth.roleLabel(r)) + '</option>';
    }).join('') + '</select>';
  }

  /* SECTION: 看板视图（REQ-006） */
  function rangeButtons() {
    var opts = [['all', '全部'], ['week', '近 7 天'], ['month', '本月']];
    return '<div class="seg small">' + opts.map(function (o) {
      return '<button class="' + (state.dashRange === o[0] ? 'on' : '') +
        '" data-action="dash-range" data-range="' + o[0] + '">' + o[1] + '</button>';
    }).join('') + '</div>';
  }

  function kpiCard(label, value, sub) {
    return '<div class="kpi"><span class="kpi-label">' + label + '</span>' +
      '<b class="kpi-value">' + value + '</b>' +
      (sub ? '<span class="kpi-sub">' + sub + '</span>' : '') + '</div>';
  }

  function renderDashboard() {
    var dash = state.svc.dashboard({ range: state.dashRange });
    var k = dash.kpi;
    var cards =
      kpiCard('配方总数', h.fmtNum(k.recipeTotal, 0), '生效 ' + k.recipeActive + ' 项') +
      kpiCard('配料批次', h.fmtNum(k.batchTotal, 0), '已完成 ' + k.batchCompleted + ' · 在产 ' + k.inProgress + ' · 调色 ' + (k.adjustedBatches || 0)) +
      kpiCard('综合合格率', h.fmtPct(k.passRate), '按已完成批次合格量') +
      kpiCard('总产出量', h.fmtNum(k.totalOutput, 0), '（含各计量单位）');

    /* 趋势面积图 */
    var trendHtml;
    if (dash.trend.length === 0) {
      trendHtml = emptyBlock('该时间范围内没有配料记录');
    } else {
      var area = h.areaChart(dash.trend.map(function (t) {
        return { date: h.fmtDate(t.date), output: t.output };
      }), { width: 640, height: 200 });
      var dots = area.coords.map(function (xy, i) {
        var t = dash.trend[i];
        return '<circle cx="' + xy[0] + '" cy="' + xy[1] + '" r="3.5" class="dot">' +
          '<title>' + h.esc(t.date) + ' 产出 ' + h.fmtNum(t.output, 1) + '</title></circle>';
      }).join('');
      var labels = dash.trend.filter(function (t, i) {
        return dash.trend.length <= 8 || i % Math.ceil(dash.trend.length / 8) === 0;
      }).length;
      void labels;
      trendHtml = '<svg viewBox="0 0 640 200" class="chart" role="img" aria-label="产量趋势">' +
        '<defs><linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/>' +
        '<stop offset="1" stop-color="var(--accent)" stop-opacity=".02"/></linearGradient></defs>' +
        '<line x1="10" y1="190" x2="630" y2="190" class="axis"/>' +
        '<path d="' + area.areaPath + '" fill="url(#areaFill)" stroke="none"/>' +
        '<polyline points="' + area.linePoints + '" class="line"/>' + dots + '</svg>' +
        '<div class="axis-x">' + dash.trend.map(function (t) {
          return '<span>' + h.esc(h.fmtDate(t.date)) + '</span>';
        }).join('') + '</div>';
    }

    /* 配方产量排行（水平条） */
    var rankHtml;
    if (!dash.ranking.length) {
      rankHtml = emptyBlock('暂无产出数据');
    } else {
      var top = dash.ranking.slice(0, 6);
      var bars = h.hBars(top.map(function (r) { return { label: r.name, value: r.output }; }),
        { max: top[0].output, width: 100 });
      rankHtml = '<div class="bars">' + bars.map(function (b, i) {
        return '<div class="bar-row"><span class="bar-label" title="' + h.esc(top[i].name) + '">' +
          h.esc(top[i].name) + '</span><span class="bar-track"><i style="width:' + b.pct + '%"></i></span>' +
          '<span class="bar-val">' + h.fmtNum(b.value, 0) + '</span></div>';
      }).join('') + '</div>';
    }

    /* 近期记录 */
    var recentHtml = dash.recent.length
      ? '<table class="mini"><thead><tr><th>批次号</th><th>配方</th><th>日期</th><th>产出</th></tr></thead><tbody>' +
        dash.recent.map(function (p) {
          return '<tr><td>' + h.esc(p.batchNo) + '</td><td>' + h.esc(p.recipeName) + '</td>' +
            '<td>' + h.esc(p.planDate) + '</td>' +
            '<td class="num">' + h.fmtNum(p.outputQty, 0) + '</td></tr>';
        }).join('') + '</tbody></table>'
      : emptyBlock('暂无记录');

    return '<div class="page-head"><h2>数据看板</h2>' + rangeButtons() + '</div>' +
      '<div class="kpi-grid">' + cards + '</div>' +
      '<div class="card-grid">' +
      panel('产量趋势', trendHtml) +
      panel('配方产量排行', rankHtml) +
      panel('近期配料记录', recentHtml) +
      '</div>';
  }

  function panel(title, inner) {
    return '<section class="panel"><h3>' + title + '</h3>' + inner + '</section>';
  }

  function emptyBlock(text) {
    return '<div class="empty"><span>◇</span><p>' + text + '</p></div>';
  }

  /* SECTION: 配方列表（REQ-003/007/009） */
  function renderRecipes() {
    var q = state.recipeQuery;
    var res = state.svc.queryRecipes(q);
    var cats = state.svc.recipeCategories();
    var canCreate = state.auth.can(state.session, 'recipe.create');

    var toolbar =
      '<div class="toolbar">' +
      '<input class="search" placeholder="搜索编号 / 名称 / 类目" value="' + h.esc(q.search) + '" data-input="recipe-search">' +
      '<select data-input="recipe-status">' + ['', 'draft', 'pending', 'active', 'obsolete'].map(function (s) {
        return '<option value="' + s + '"' + (q.status === s ? ' selected' : '') + '>' +
          (s ? h.esc(h.recipeStatusLabel(s)) : '全部状态') + '</option>';
      }).join('') + '</select>' +
      '<select data-input="recipe-category">' + [''].concat(cats).map(function (c) {
        return '<option value="' + h.esc(c) + '"' + (q.category === c ? ' selected' : '') + '>' +
          (c ? h.esc(c) : '全部类目') + '</option>';
      }).join('') + '</select>' +
      (canCreate ? '<button class="btn primary" data-action="recipe-new" data-primary-action="recipe-create">＋ 新建配方</button>' : '') +
      '<button class="btn ghost" data-action="recipe-export">导出 CSV</button>' +
      '</div>';

    var rows = res.items.map(function (r) {
      var canUpdate = state.auth.can(state.session, 'recipe.update');
      var canCreate = state.auth.can(state.session, 'recipe.create');
      var canDelete = state.auth.can(state.session, 'recipe.delete');
      var actions =
        '<button class="btn xs" data-action="recipe-view" data-id="' + h.esc(r.id) + '">详情</button>' +
        '<button class="btn xs" data-action="recipe-history" data-id="' + h.esc(r.id) + '">历史</button>' +
        (canUpdate && r.status === 'draft'
          ? '<button class="btn xs" data-action="recipe-edit" data-id="' + h.esc(r.id) + '">编辑</button>' : '') +
        (canUpdate && r.status === 'active'
          ? '<button class="btn xs" data-action="recipe-update" data-id="' + h.esc(r.id) + '">更新配方</button>' : '') +
        (canCreate
          ? '<button class="btn xs" data-action="recipe-dup" data-id="' + h.esc(r.id) + '">复制</button>' : '') +
        recipeFlowButton(r) +
        (canDelete
          ? '<button class="btn xs danger" data-action="recipe-del" data-id="' + h.esc(r.id) + '">删除</button>' : '');
      return '<tr>' +
        '<td>' + h.esc(r.name) + (r.version ? '<em class="sub">' + h.esc(r.version) + '</em>' : '') + '</td>' +
        '<td>' + h.esc(r.category || '—') + '</td>' +
        '<td><span class="chip ' + h.esc(r.status) + '">' + h.esc(h.recipeStatusLabel(r.status)) + '</span></td>' +
        '<td class="num">' + (r.components || []).length + '</td>' +
        '<td class="num dim">' + h.esc(h.fmtDateTime(r.updatedAt)) + '</td>' +
        '<td class="row-actions">' + actions + '</td></tr>';
    }).join('');

    var table = res.total
      ? '<div class="table-wrap"><table><thead><tr>' +
        '<th>名称</th><th>类目</th>' + sortTh('status', '状态', q) + '<th class="num">组分数</th>' +
        sortTh('updatedAt', '更新时间', q, 'num') + '<th></th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table></div>' + pager(res)
      : '<div class="table-wrap">' + emptyBlock('没有符合条件的配方，试试调整筛选或新建一条') + '</div>';

    return '<div class="page-head"><h2>配方管理</h2><span class="muted">共 ' + res.total + ' 项</span></div>' +
      toolbar + table;
  }

  var RECIPE_NEXT = {
    draft: [['pending', '提交审批']],
    pending: [['active', '审批通过'], ['draft', '退回修改']],
    active: [['obsolete', '停用']],
    obsolete: []
  };

  function recipeFlowButton(r) {
    var nexts = (RECIPE_NEXT[r.status] || []).filter(function (n) {
      /* pending 状态的审批通过/退回修改均需 recipe.approve 权限 */
      if (r.status === 'pending') { return state.auth.can(state.session, 'recipe.approve'); }
      return true;
    });
    if (!nexts.length) { return ''; }
    return nexts.map(function (n) {
      return '<button class="btn xs accent" data-action="recipe-flow" data-id="' + h.esc(r.id) +
        '" data-next="' + n[0] + '">' + n[1] + '</button>';
    }).join('');
  }

  function sortTh(key, label, q, cls) {
    var mark = q.sort === key ? (q.dir === 'asc' ? ' ↑' : ' ↓') : '';
    return '<th class="sortable' + (cls ? ' ' + cls : '') + '" data-action="sort" data-key="' + key + '">' + label + mark + '</th>';
  }

  /* 分页/排序控件归属哪张表：生产页/原料页/配方页 */
  function activeQuery() {
    if (state.view === 'production') { return state.prodQuery; }
